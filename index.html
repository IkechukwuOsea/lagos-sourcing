  var msg = document.getElementById("startup-error-message");
  if (box && msg) {
    box.style.display = "block";
    msg.textContent = (e.error && e.error.stack) || e.message || "Unknown JavaScript error";
  }
});
window.addEventListener("unhandledrejection", function(e) {
  var box = document.getElementById("startup-error");
  var msg = document.getElementById("startup-error-message");
  if (box && msg) {
    box.style.display = "block";
    msg.textContent = "Unhandled promise rejection: " + String(e.reason || "Unknown error");
  }
});

<script>
// ============================================================
// STORAGE LAYER
// ------------------------------------------------------------
// `users` is stored as ONE shared record: a JSON array of every
// registered account (client / vendor / admin). Small dataset,
// single business — one key keeps this simple and cheap to read.
//
// `session` is PERSONAL (per browser/account), not shared: it
// just remembers "who is using this device" so a refresh doesn't
// log you out. It holds no secret — see the auth note in the UI.
// ============================================================

const USERS_KEY = "users";
const SESSION_KEY = "session";
const ORDERS_KEY = "orders";

async function getUsers() {
  try {
    const res = await window.storage.get(USERS_KEY, true);
    return res && Array.isArray(JSON.parse(res.value)) ? JSON.parse(res.value) : [];
  } catch (e) {
    return [];
  }
}

async function saveUsers(users) {
  await window.storage.set(USERS_KEY, JSON.stringify(users), true);
}

async function getOrders() {
  try {
    const res = await window.storage.get(ORDERS_KEY, true);
    return res && Array.isArray(JSON.parse(res.value)) ? JSON.parse(res.value) : [];
  } catch (e) {
    return [];
  }
}

async function saveOrders(orders) {
  await window.storage.set(ORDERS_KEY, JSON.stringify(orders), true);
}

async function getSession() {
  try {
    const res = await window.storage.get(SESSION_KEY, false);
    return res ? JSON.parse(res.value) : null;
  } catch (e) {
    return null;
  }
}

async function saveSession(session) {
  await window.storage.set(SESSION_KEY, JSON.stringify(session), false);
}

async function clearSession() {
  try {
    await window.storage.delete(SESSION_KEY, false);
  } catch (e) {}
}

// ============================================================
// DATA MODEL (documented here so it's visible to reviewers,
// not just implied by code shape)
// ------------------------------------------------------------
// User {
//   id: string
//   name: string
//   phone: string            // used to "log in" for now, see auth note
//   role: "client" | "vendor" | "admin"
//   businessName?: string    // vendor only
//   market?: string          // vendor only, e.g. "Computer Village (Ikeja)"
//   categories?: string[]    // vendor only, self-declared product tags e.g. ["laptops","phones"]
//                             // used by the AI search assistant to match client queries
//   verified: boolean        // vendor only, admin-granted badge
//   createdAt: string (ISO)
// }
//
// Order {
//   id: string
//   clientId, vendorId: string
//   itemDesc: string          // what the client is asking for
//   market: string
//   status: "requested" | "invoiced" | "escrow_funded" | "shipped"
//         | "in_transit" | "completed" | "disputed" | "refunded" | "declined" | "cancelled"
//     requested      -> client asked, vendor hasn't priced yet
//     invoiced       -> vendor priced it, invoice generated
//     escrow_funded  -> client has paid into escrow (SIMULATED, see note below)
//     shipped        -> vendor uploaded proof of shipment
//     in_transit     -> vendor confirms the shipment is with the carrier/courier
//     completed      -> client confirmed receipt (or auto-release fired) -> funds "released"
//     disputed       -> client rejected the order, admin must resolve
//     refunded       -> admin resolved a dispute in the client's favor
//     declined       -> vendor couldn't source the item
//   itemCost?: number         // filled in by vendor when invoicing
//   deliveryCost?: number     // filled in by vendor when invoicing
//   totalCost?: number        // itemCost + deliveryCost. No separate sourcing fee.
//   invoiceNumber?: string
//   invoicedAt?: string (ISO)
//   escrowFundedAt?: string (ISO)
//   shipmentProof?: string    // vendor's description of what/how they shipped
//   shippedAt?: string (ISO)
//   completedAt?: string (ISO)
//   autoReleased?: boolean    // true if release happened via the inspection-window timeout, not a client click
//   dispute?: {
//     reason: string
//     raisedAt: string (ISO)
//     status: "open" | "resolved"
//     resolution?: "release" | "refund"
//     adminNotes?: string
//     resolvedAt?: string (ISO)
//   }
//   statusHistory: { status: string, at: string (ISO) }[]  // audit trail, shown to both sides for transparency
//   createdAt: string (ISO)
// }
//
// IMPORTANT — escrow is simulated here, not real:
// There is no payment gateway wired up in this prototype. "Client funds escrow"
// just flips a status field. Before this handles real money, "fund escrow" must
// call an actual payment processor (e.g. Paystack) on a real backend, and only
// flip to escrow_funded once that processor confirms the charge succeeded.
// ============================================================

function uid(prefix) {
  return prefix + "-" + Math.random().toString(36).slice(2, 8).toUpperCase();
}

// If a client neither confirms nor disputes within this many days of shipment,
// the order auto-completes so a vendor's payment can't be held hostage forever.
const AUTO_RELEASE_DAYS = 3;

function pushHistory(order, status) {
  order.statusHistory = order.statusHistory || [];
  order.statusHistory.push({ status, at: new Date().toISOString() });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

let state = {
  users: [],
  orders: [],
  currentUser: null,
  view: "loading", // loading | auth | dashboard
  authMode: "login", // login | signup
  authRole: "client",
  error: "",
  requestingVendorId: null, // client is filling out a request form for this vendor
  requestError: "",
  invoicingOrderId: null, // vendor is filling out an invoice for this order
  invoiceError: "",
  shippingOrderId: null, // vendor is filling out shipment proof for this order
  shipError: "",
  disputingOrderId: null, // client is filling out a dispute for this order
  disputeError: "",
  aiQuery: "",
  aiSearching: false,
  aiError: "",
  aiSuggestions: null, // array of { vendorId, reason } once a search runs
  aiSummary: "",
  prefillItemDesc: "", // carries the AI search query into the request form
};

async function init() {
  state.users = await getUsers();
  state.orders = await getOrders();
  await runAutoRelease();

  // Seed a demo admin account on first run so there's always a way in.
  if (!state.users.some((u) => u.role === "admin")) {
    state.users.push({
      id: uid("USR"),
      name: "Platform Admin",
      phone: "00000000000",
      role: "admin",
      verified: true,
      createdAt: new Date().toISOString(),
    });
    await saveUsers(state.users);
  }

  const session = await getSession();
  if (session && session.userId) {
    const found = state.users.find((u) => u.id === session.userId);
    if (found) {
      state.currentUser = found;
      state.view = "dashboard";
      render();
      return;
    }
  }
  state.view = "auth";
  render();
}

async function handleSignup(e) {
  e.preventDefault();
  const name = document.getElementById("su-name").value.trim();
  const phone = document.getElementById("su-phone").value.trim();
  const businessName = document.getElementById("su-business")
    ? document.getElementById("su-business").value.trim()
    : "";
  const market = document.getElementById("su-market")
    ? document.getElementById("su-market").value
    : "";
  const categoriesRaw = document.getElementById("su-categories")
    ? document.getElementById("su-categories").value.trim()
    : "";

  if (!name || !phone) {
    state.error = "Enter a name and phone number.";
    render();
    return;
  }
  if (state.users.some((u) => u.phone === phone)) {
    state.error = "That phone number is already registered. Try logging in instead.";
    render();
    return;
  }

  const newUser = {
    id: uid("USR"),
    name,
    phone,
    role: state.authRole,
    verified: false,
    createdAt: new Date().toISOString(),
  };
  if (state.authRole === "vendor") {
    newUser.businessName = businessName || name;
    newUser.market = market || "Computer Village (Ikeja)";
    newUser.categories = categoriesRaw
      ? categoriesRaw.split(",").map((c) => c.trim()).filter(Boolean)
      : [];
  }

  state.users.push(newUser);
  await saveUsers(state.users);
  state.currentUser = newUser;
  await saveSession({ userId: newUser.id });
  state.view = "dashboard";
  state.error = "";
  render();
}

async function handleLogin(e) {
  e.preventDefault();
  const phone = document.getElementById("li-phone").value.trim();
  const found = state.users.find((u) => u.phone === phone);
  if (!found) {
    state.error = "No account found with that phone number.";
    render();
    return;
  }
  state.currentUser = found;
  await saveSession({ userId: found.id });
  state.view = "dashboard";
  state.error = "";
  render();
}

async function handleLogout() {
  await clearSession();
  state.currentUser = null;
  state.view = "auth";
  state.authMode = "login";
  state.error = "";
  render();
}

function switchAuthMode(mode) {
  state.authMode = mode;
  state.error = "";
  render();
}

function switchAuthRole(role) {
  state.authRole = role;
  state.error = "";
  render();
}

// ---- Admin: vendor verification ----

async function toggleVendorVerified(userId) {
  const u = state.users.find((x) => x.id === userId);
  if (!u || u.role !== "vendor") return;
  u.verified = !u.verified;
  await saveUsers(state.users);
  render();
}

// ---- Client: AI product-search assistant ----
// Uses the Claude API to turn a natural-language request into a ranked
// shortlist of VERIFIED vendors, matched against each vendor's self-declared
// categories/market/business name. There is no live product inventory in
// this prototype, so the AI is matching descriptions, not real stock or
// prices — it can point you to the right vendor, it can't confirm they
// currently have the exact item in hand. That confirmation still happens
// in the request -> quote step that follows.

async function runAiSearch(e) {
  e.preventDefault();
  const query = document.getElementById("ai-search-input").value.trim();
  if (!query) {
    state.aiError = "Describe what you're looking for.";
    render();
    return;
  }

  const verifiedVendors = state.users.filter((x) => x.role === "vendor" && x.verified);
  if (!verifiedVendors.length) {
    state.aiError = "No verified vendors on the platform yet, so there's nothing to search.";
    render();
    return;
  }

  state.aiQuery = query;
  state.aiSearching = true;
  state.aiError = "";
  state.aiSuggestions = null;
  render();

  const vendorSummary = verifiedVendors
    .map(
      (v) =>
        `- id: ${v.id} | name: ${v.businessName || v.name} | market: ${v.market || "unspecified"} | sells: ${
          v.categories && v.categories.length ? v.categories.join(", ") : "not specified"
        }`
    )
    .join("\n");

  const systemPrompt = `You help a client on a Lagos sourcing platform find the right vendor for what they want to buy.
You are given a list of verified vendors with their market and self-declared product categories, and a client's request.
Pick the vendors that are a plausible fit. If nothing is a good fit, return an empty suggestions array rather than guessing.
Respond with ONLY raw JSON, no markdown fences, no preamble, in exactly this shape:
{"summary": "one short sentence about what you're recommending and why", "suggestions": [{"vendorId": "USR-XXXXXX", "reason": "short reason this vendor fits, under 20 words"}]}
Include at most 3 suggestions, ordered best first. Only use vendorId values from the list below — never invent one.

Vendors:
${vendorSummary}`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: query }],
      }),
    });

    if (!response.ok) {
      throw new Error("Search request failed (" + response.status + ")");
    }

    const data = await response.json();
    const textBlock = (data.content || []).find((b) => b.type === "text");
    if (!textBlock || !textBlock.text) {
      throw new Error("No response from the assistant.");
    }

    const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(cleaned);

    const validIds = new Set(verifiedVendors.map((v) => v.id));
    const suggestions = Array.isArray(parsed.suggestions)
      ? parsed.suggestions.filter((s) => s && validIds.has(s.vendorId)).slice(0, 3)
      : [];

    state.aiSummary = typeof parsed.summary === "string" ? parsed.summary : "";
    state.aiSuggestions = suggestions;
  } catch (err) {
    console.error("AI search failed:", err);
    state.aiError = "Couldn't complete the search right now. You can still browse verified vendors below.";
    state.aiSuggestions = null;
  } finally {
    state.aiSearching = false;
    render();
  }
}

function requestFromSuggestion(vendorId) {
  state.prefillItemDesc = state.aiQuery;
  openRequestForm(vendorId);
}

// ---- Client: request an item from a verified vendor ----

function openRequestForm(vendorId) {
  state.requestingVendorId = vendorId;
  state.requestError = "";
  render();
}

function closeRequestForm() {
  state.requestingVendorId = null;
  state.requestError = "";
  state.prefillItemDesc = "";
  render();
}

async function submitRequest(e) {
  e.preventDefault();
  const vendor = state.users.find((u) => u.id === state.requestingVendorId);
  const itemDesc = document.getElementById("req-item").value.trim();
  if (!vendor) {
    state.requestError = "That vendor is no longer available.";
    render();
    return;
  }
  if (!itemDesc) {
    state.requestError = "Describe the item you want to order.";
    render();
    return;
  }

  const order = {
    id: uid("ORD"),
    clientId: state.currentUser.id,
    vendorId: vendor.id,
    itemDesc,
    market: vendor.market || "",
    status: "requested",
    statusHistory: [],
    createdAt: new Date().toISOString(),
  };
  pushHistory(order, "requested");
  state.orders.unshift(order);
  await saveOrders(state.orders);
  state.requestingVendorId = null;
  state.requestError = "";
  render();
}

// ---- Vendor: quote + generate invoice for a request ----

function openInvoiceForm(orderId) {
  state.invoicingOrderId = orderId;
  state.invoiceError = "";
  render();
}

function closeInvoiceForm() {
  state.invoicingOrderId = null;
  state.invoiceError = "";
  render();
}

async function submitInvoice(e) {
  e.preventDefault();
  const order = state.orders.find((o) => o.id === state.invoicingOrderId);
  if (!order) return;

  const itemCost = Number(document.getElementById("inv-item-cost").value);
  const deliveryCost = Number(document.getElementById("inv-delivery-cost").value);

  if (!itemCost || itemCost <= 0) {
    state.invoiceError = "Enter a valid item cost.";
    render();
    return;
  }
  if (deliveryCost < 0 || Number.isNaN(deliveryCost)) {
    state.invoiceError = "Enter a valid delivery cost (0 is fine).";
    render();
    return;
  }

  order.itemCost = itemCost;
  order.deliveryCost = deliveryCost;
  order.totalCost = itemCost + deliveryCost;
  order.status = "invoiced";
  order.invoiceNumber = order.invoiceNumber || uid("INV");
  order.invoicedAt = new Date().toISOString();
  pushHistory(order, "invoiced");

  await saveOrders(state.orders);
  state.invoicingOrderId = null;
  state.invoiceError = "";
  render();
}

async function cancelOrder(orderId) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order || !state.currentUser || state.currentUser.role !== "client") return;
  if (order.clientId !== state.currentUser.id) return;

  // Clients may cancel before escrow is funded. Once funds are held,
  // the safer path is dispute resolution rather than unilateral cancellation.
  if (!["requested", "invoiced"].includes(order.status)) {
    state.error = "This order can no longer be cancelled. Use the dispute process after escrow is funded.";
    render();
    return;
  }

  const confirmed = window.confirm("Cancel this order? This cannot be undone.");
  if (!confirmed) return;

  order.status = "cancelled";
  order.cancelledAt = new Date().toISOString();
  order.cancelledBy = state.currentUser.id;
  pushHistory(order, "cancelled");
  await saveOrders(state.orders);
  state.error = "";
  render();
}

async function declineRequest(orderId) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order) return;
  order.status = "declined";
  pushHistory(order, "declined");
  await saveOrders(state.orders);
  render();
}

// ---- Client: fund escrow (SIMULATED — see data model note above) ----

async function fundEscrow(orderId) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order || order.status !== "invoiced") return;
  order.status = "escrow_funded";
  order.escrowFundedAt = new Date().toISOString();
  pushHistory(order, "escrow_funded");
  await saveOrders(state.orders);
  render();
}

// ---- Vendor: upload shipment proof ----

function openShipForm(orderId) {
  state.shippingOrderId = orderId;
  state.shipError = "";
  render();
}

function closeShipForm() {
  state.shippingOrderId = null;
  state.shipError = "";
  render();
}

async function submitShipment(e) {
  e.preventDefault();
  const order = state.orders.find((o) => o.id === state.shippingOrderId);
  if (!order) return;
  const proof = document.getElementById("ship-proof").value.trim();
  if (!proof) {
    state.shipError = "Describe how the item was shipped (carrier, tracking, photo reference, etc.)";
    render();
    return;
  }
  order.shipmentProof = proof;
  order.status = "shipped";
  order.shippedAt = new Date().toISOString();
  pushHistory(order, "shipped");
  await saveOrders(state.orders);
  state.shippingOrderId = null;
  state.shipError = "";
  render();
}

async function markInTransit(orderId) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order || order.status !== "shipped") return;
  order.status = "in_transit";
  order.inTransitAt = new Date().toISOString();
  pushHistory(order, "in_transit");
  await saveOrders(state.orders);
  render();
}

// ---- Client: confirm receipt or dispute ----

async function confirmReceipt(orderId) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order || !["shipped", "in_transit"].includes(order.status)) return;
  order.status = "completed";
  order.completedAt = new Date().toISOString();
  pushHistory(order, "completed");
  await saveOrders(state.orders);
  render();
}

function openDisputeForm(orderId) {
  state.disputingOrderId = orderId;
  state.disputeError = "";
  render();
}

function closeDisputeForm() {
  state.disputingOrderId = null;
  state.disputeError = "";
  render();
}

async function submitDispute(e) {
  e.preventDefault();
  const order = state.orders.find((o) => o.id === state.disputingOrderId);
  if (!order) return;
  const reason = document.getElementById("dispute-reason").value.trim();
  if (!reason) {
    state.disputeError = "Explain what went wrong so admin can review it.";
    render();
    return;
  }
  order.status = "disputed";
  order.dispute = { reason, raisedAt: new Date().toISOString(), status: "open" };
  pushHistory(order, "disputed");
  await saveOrders(state.orders);
  state.disputingOrderId = null;
  state.disputeError = "";
  render();
}

// ---- Admin: resolve a dispute ----

async function resolveDispute(orderId, resolution) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order || !order.dispute) return;
  const notesEl = document.getElementById("dispute-notes-" + orderId);
  order.dispute.status = "resolved";
  order.dispute.resolution = resolution; // "release" or "refund"
  order.dispute.adminNotes = notesEl ? notesEl.value.trim() : "";
  order.dispute.resolvedAt = new Date().toISOString();
  order.status = resolution === "release" ? "completed" : "refunded";
  pushHistory(order, order.status);
  await saveOrders(state.orders);
  render();
}

// ---- Auto-release: if a client never confirms or disputes within the
// inspection window, complete the order automatically so a vendor's
// payment isn't held hostage indefinitely. Runs on every load/render cycle
// against stored timestamps — no server-side cron in this prototype. ----

async function runAutoRelease() {
  const now = Date.now();
  let changed = false;
  for (const order of state.orders) {
    if (["shipped", "in_transit"].includes(order.status) && order.shippedAt) {
      const elapsedDays = (now - new Date(order.shippedAt).getTime()) / (1000 * 60 * 60 * 24);
      if (elapsedDays >= AUTO_RELEASE_DAYS) {
        order.status = "completed";
        order.completedAt = new Date().toISOString();
        order.autoReleased = true;
        pushHistory(order, "completed (auto-released)");
        changed = true;
      }
    }
  }
  if (changed) await saveOrders(state.orders);
}

function renderOrderTracking(order, role) {
  const stages = [
    { key: "requested", label: "Request submitted", icon: "fa-paper-plane" },
    { key: "invoiced", label: "Quote / invoice", icon: "fa-file-invoice" },
    { key: "escrow_funded", label: "Escrow funded", icon: "fa-lock" },

    { key: "shipped", label: "Shipped", icon: "fa-box" },
    { key: "in_transit", label: "In transit", icon: "fa-truck" },
    { key: "completed", label: "Delivered / completed", icon: "fa-circle-check" }
  ];
  const rank = { requested: 0, invoiced: 1, escrow_funded: 2, sourcing: 3, shipped: 4, in_transit: 5, completed: 6, disputed: 5, refunded: 6, declined: -1, cancelled: -1 };
  const current = order.status === "escrow_funded" ? 2 : rank[order.status] ?? 0;
  const history = order.statusHistory || [];
  const hasSourcing = order.status === "escrow_funded" || history.some(h => h.status === "sourcing");

  return `
    <div class="mt-4 border border-slate-200 rounded-xl p-4 bg-white">

          const completed = stage.key === "sourcing" ? current > 2 : current > i;
          const active = stage.key === "sourcing" ? order.status === "escrow_funded" : stage.key === order.status;
          const done = completed || (stage.key === "sourcing" && hasSourcing && current >= 3);
          const cls = active ? "border-emerald-600 bg-emerald-50 text-emerald-800" : done ? "border-emerald-200 bg-emerald-50 text-emerald-700" : "border-slate-200 bg-slate-50 text-slate-400";
          const icon = done && !active ? "fa-check" : stage.icon;
          return `<div class="border rounded-lg p-2 text-center ${cls}"><i class="fa-solid ${icon} text-xs"></i><p class="text-[11px] font-semibold mt-1">${stage.label}</p></div>`;
        }).join("")}
      </div>
      ${order.shipmentProof ? `<div class="mt-3 text-xs text-slate-600"><span class="font-semibold">Shipment details:</span> ${escapeHtml(order.shipmentProof)}</div>` : ""}
    </div>
  `;
}

function printOrderReceipt(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  if (!order) return;
  const client = state.users.find(u => u.id === order.clientId);
  const vendor = state.users.find(u => u.id === order.vendorId);
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Lagos Sourcing Receipt ${escapeHtml(order.id)}</title><style>body{font-family:Arial,sans-serif;padding:32px;color:#222}h1{font-size:22px}table{width:100%;border-collapse:collapse;margin-top:18px}td{padding:8px;border-bottom:1px solid #ddd}.total{font-weight:bold;font-size:18px}@media print{button{display:none}}</style></head><body><h1>Lagos Sourcing — Order Receipt</h1><p><b>Order:</b> ${escapeHtml(order.id)}</p><p><b>Date:</b> ${new Date(order.createdAt).toLocaleString()}</p><table><tr><td>Client</td><td>${escapeHtml(client ? client.name : "Unknown")}</td></tr><tr><td>Vendor</td><td>${escapeHtml(vendor ? (vendor.businessName || vendor.name) : "Unknown")}</td></tr><tr><td>Item</td><td>${escapeHtml(order.itemDesc)}</td></tr><tr><td>Market</td><td>${escapeHtml(order.market || "")}</td></tr><tr><td>Status</td><td>${escapeHtml(order.status)}</td></tr>${order.itemCost != null ? `<tr><td>Item cost</td><td>${formatNaira(order.itemCost)}</td></tr>` : ""}${order.deliveryCost != null ? `<tr><td>Delivery</td><td>${formatNaira(order.deliveryCost)}</td></tr>` : ""}${order.totalCost != null ? `<tr class="total"><td>Total</td><td>${formatNaira(order.totalCost)}</td></tr>` : ""}${order.shipmentProof ? `<tr><td>Shipment details</td><td>${escapeHtml(order.shipmentProof)}</td></tr>` : ""}</table><p style="margin-top:24px;font-size:12px;color:#666">Prototype receipt — payment and escrow are currently simulated.</p><script>window.onload=()=>window.print();<\/script></body></html>`;
  const w = window.open("", "_blank", "width=800,height=900");
  if (!w) { alert("Please allow pop-ups to print the receipt."); return; }
  w.document.write(html); w.document.close();
}

          ${
            o.status === "disputed"
              ? `<p class="text-sm text-red-700 mt-2"><i class="ti ti-flag"></i> Dispute submitted, an admin is reviewing it. Funds stay held until resolved.</p>`
              : ""
          }
          ${o.status === "refunded" ? `<p class="text-sm text-slate-600 mt-2"><i class="ti ti-receipt-refund"></i> Refunded by admin after dispute review.</p>` : ""}
        </div>
      `;
        })
        .join("")
    : `<p class="text-sm text-slate-500">No orders yet.</p>`;

  return `
    ${requestModal}
    <div class="grid sm:grid-cols-2 gap-6">
      <div>
        <p class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="ti ti-search"></i> Verified vendors</p>
        <div class="space-y-3">${vendorCards}</div>
      </div>
      <div>
        <p class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="ti ti-package"></i> My orders</p>
        <div class="space-y-3">${orderRows}</div>
      </div>
    </div>
  `;
}

function renderVendorPanels(u) {
  if (!u.verified) {
    return `
      <div class="card p-6 text-center">
        <i class="ti ti-clock text-2xl text-amber-600"></i>
        <p class="text-sm font-semibold mt-2">Awaiting admin verification</p>
        <p class="text-sm text-slate-500 mt-1">Clients can only see and order from verified vendors. An admin needs to approve your account before requests start coming in.</p>
      </div>
    `;
  }

  const myOrders = state.orders.filter((o) => o.vendorId === u.id);
  const requested = myOrders.filter((o) => o.status === "requested");
  const others = myOrders.filter((o) => o.status !== "requested");

  const requestedRows = requested.length
    ? requested
        .map((o) => {
          const client = state.users.find((x) => x.id === o.clientId);
          const isInvoicing = state.invoicingOrderId === o.id;
          return `
        <div class="card p-4">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-sm font-semibold">${escapeHtml(o.itemDesc)}</p>
              <p class="text-xs text-slate-500">From ${escapeHtml(client ? client.name : "Unknown")} &middot; ${new Date(o.createdAt).toLocaleDateString()}</p>
            </div>
            ${statusBadge(o.status)}
          </div>
          ${
            isInvoicing
              ? `
            <form onsubmit="submitInvoice(event)" class="mt-3 space-y-2 border-t border-slate-200 pt-3">
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="text-xs text-slate-500">Item cost (\u20A6)</label>
                  <input id="inv-item-cost" type="number" min="0" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div>
                  <label class="text-xs text-slate-500">Delivery cost (\u20A6)</label>
                  <input id="inv-delivery-cost" type="number" min="0" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
                </div>
              </div>
              ${state.invoiceError ? `<p class="text-sm text-red-600">${escapeHtml(state.invoiceError)}</p>` : ""}
              <div class="flex gap-2">
                <button type="submit" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Generate invoice</button>
                <button type="button" onclick="closeInvoiceForm()" class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-300">Cancel</button>
              </div>
            </form>
          `
              : `
            <div class="flex gap-2 mt-3">
              <button onclick="openInvoiceForm('${o.id}')" class="text-sm font-semibold px-3 py-1.5 rounded-lg btn-primary">Quote &amp; invoice</button>
              <button onclick="declineRequest('${o.id}')" class="text-sm font-semibold px-3 py-1.5 rounded-lg border border-slate-300">Decline</button>
            </div>
          `
          }
        </div>
      `;
        })
        .join("")
    : `<p class="text-sm text-slate-500">No new requests right now.</p>`;

  const otherRows = others.length
    ? others
        .map((o) => {
          const client = state.users.find((x) => x.id === o.clientId);
          const isShipping = state.shippingOrderId === o.id;
          return `
        <div class="card p-4">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-sm font-semibold">${escapeHtml(o.itemDesc)}</p>
              <p class="text-xs text-slate-500">${escapeHtml(client ? client.name : "Unknown")}</p>
            </div>
            ${statusBadge(o.status)}
          </div>
          ${o.status === "invoiced" || o.status === "escrow_funded" || o.status === "shipped" || o.status === "completed" ? renderInvoiceBlock(o, u, client) : ""}
          ${o.status === "invoiced" ? `<p class="text-sm text-slate-500 mt-2">Waiting for client to pay into escrow.</p>` : ""}
          ${
            o.status === "escrow_funded"
              ? isShipping
                ? `
              <form onsubmit="submitShipment(event)" class="mt-3 space-y-2 border-t border-slate-200 pt-3">
                <label class="text-xs text-slate-500">Shipment details (carrier, tracking number, courier name, etc.)</label>
                <textarea id="ship-proof" rows="2" placeholder="e.g. Sent via GIG Logistics, tracking GIG-93821" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
                ${state.shipError ? `<p class="text-sm text-red-600">${escapeHtml(state.shipError)}</p>` : ""}
                <div class="flex gap-2">
                  <button type="submit" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Mark as shipped</button>
                  <button type="button" onclick="closeShipForm()" class="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-300">Cancel</button>
                </div>
              </form>
            `
                : `<p class="text-sm text-emerald-700 mt-2 mb-2"><i class="ti ti-lock"></i> Escrow funded &mdash; ship the item, then log the proof here.</p>
                   <button onclick="openShipForm('${o.id}')" class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Log shipment</button>`
              : ""
          }
          ${o.status === "shipped" ? `<div class="mt-2 flex gap-2"><p class="text-sm text-amber-700 flex-1">Shipped &mdash; move it to transit when the courier has it.</p><button onclick="markInTransit('${o.id}')" class="text-sm font-semibold px-3 py-1.5 rounded-lg border border-amber-300 text-amber-800">Mark in transit</button></div>` : ""}
          ${renderOrderTracking(o, "vendor")}
          ${o.status === "completed" ? `<p class="text-sm text-emerald-700 mt-2"><i class="ti ti-circle-check"></i> Completed &mdash; funds released.</p>` : ""}
          ${o.status === "disputed" ? `<p class="text-sm text-red-700 mt-2"><i class="ti ti-flag"></i> Client disputed this order: "${escapeHtml(o.dispute ? o.dispute.reason : "")}". Admin is reviewing.</p>` : ""}
          ${o.status === "refunded" ? `<p class="text-sm text-slate-600 mt-2">Refunded to client after dispute review.</p>` : ""}
        </div>
      `;
        })
        .join("")
    : "";

  return `
    <div class="grid sm:grid-cols-2 gap-6">
      <div>
        <p class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="ti ti-inbox"></i> New requests</p>
        <div class="space-y-3">${requestedRows}</div>
      </div>
      <div>
        <p class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="ti ti-file-invoice"></i> Quoted / invoiced</p>
        <div class="space-y-3">${otherRows || '<p class="text-sm text-slate-500">Nothing here yet.</p>'}</div>
      </div>
    </div>
  `;
}

function renderAdminProgress() {
  const total = state.orders.length;
  const stages = [
    ["requested", "Requested"],
    ["invoiced", "Invoiced"],
    ["escrow_funded", "Escrow funded"],
    ["shipped", "Shipped"],
    ["in_transit", "In transit"],
    ["completed", "Completed"],
  ];
  const active = state.orders.filter(o => !["completed", "cancelled", "declined", "refunded"].includes(o.status)).length;
  const completed = state.orders.filter(o => o.status === "completed").length;
  const cancelled = state.orders.filter(o => ["cancelled", "declined", "refunded"].includes(o.status)).length;
  const percent = total ? Math.round((completed / total) * 100) : 0;

  const bars = stages.map(([status, label]) => {
    const count = state.orders.filter(o => o.status === status).length;
    const width = total ? Math.round((count / total) * 100) : 0;
    return `<div class="mb-2">
      <div class="flex justify-between text-xs mb-1"><span class="font-medium">${label}</span><span class="text-slate-500">${count}</span></div>
      <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-600 rounded-full" style="width:${width}%"></div></div>
    </div>`;
  }).join("");

  return `<div class="card p-5 mb-6 border-l-4" style="border-left-color:#14312B;">
    <div class="flex justify-between items-start mb-4">
      <div>
        <p class="text-xs uppercase tracking-wide text-slate-400">Admin operations</p>
        <p class="text-lg font-bold">Platform progress bar</p>
        <p class="text-xs text-slate-500">Live overview of order flow. This is a frontend admin dashboard; a real backend is still required for production controls.</p>
      </div>
      <span class="text-sm font-bold text-emerald-700">${percent}% completed</span>
    </div>
    <div class="grid grid-cols-3 gap-3 mb-5">
      <div class="bg-slate-50 rounded-lg p-3"><p class="text-xl font-bold">${total}</p><p class="text-xs text-slate-500">Total orders</p></div>
      <div class="bg-emerald-50 rounded-lg p-3"><p class="text-xl font-bold text-emerald-700">${active}</p><p class="text-xs text-slate-500">Active</p></div>
      <div class="bg-slate-50 rounded-lg p-3"><p class="text-xl font-bold">${cancelled}</p><p class="text-xs text-slate-500">Closed without completion</p></div>
    </div>
    ${bars}
  </div>`;
}

function renderAdminPanels(u) {
  const clients = state.users.filter((x) => x.role === "client").length;
  const vendors = state.users.filter((x) => x.role === "vendor");
  const verifiedCount = vendors.filter((v) => v.verified).length;
  const openDisputes = state.orders.filter((o) => o.status === "disputed");

  const disputeRows = openDisputes.length
    ? openDisputes
        .map((o) => {
          const client = state.users.find((x) => x.id === o.clientId);
          const vendor = state.users.find((x) => x.id === o.vendorId);
          return `
        <div class="card p-4 border-l-4" style="border-left-color:#791F1F;">
          <div class="flex justify-between items-start mb-2">
            <div>
              <p class="text-sm font-semibold">${escapeHtml(o.itemDesc)}</p>
              <p class="text-xs text-slate-500">Client: ${escapeHtml(client ? client.name : "Unknown")} &middot; Vendor: ${escapeHtml(vendor ? (vendor.businessName || vendor.name) : "Unknown")}</p>
              <p class="text-xs text-slate-500">Order total: ${formatNaira(o.totalCost)}</p>
            </div>
          </div>
          <p class="text-sm bg-red-50 text-red-800 rounded-lg px-3 py-2 mb-3">"${escapeHtml(o.dispute.reason)}"</p>
          <label class="text-xs text-slate-500">Admin notes (optional, kept on record)</label>
          <textarea id="dispute-notes-${o.id}" rows="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-2"></textarea>
          <div class="flex gap-2">
            <button onclick="resolveDispute('${o.id}', 'release')" class="px-4 py-2 rounded-lg text-sm font-semibold btn-primary">Release to vendor</button>
            <button onclick="resolveDispute('${o.id}', 'refund')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-red-600 text-white">Refund client</button>
          </div>
        </div>
      `;
        })
        .join("")
    : `<p class="text-sm text-slate-500">No open disputes.</p>`;

  const userRows = state.users
    .map((x) => {
      const verifyControl =
        x.role === "vendor"
          ? `<button onclick="toggleVendorVerified('${x.id}')" class="text-xs font-semibold px-2 py-1 rounded-full ${
              x.verified ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"
            }">${x.verified ? "Verified \u2713" : "Verify now"}</button>`
          : `<span class="text-xs text-slate-300">&mdash;</span>`;
      return `
        <tr class="border-t border-slate-100">
          <td class="py-2 text-sm mono">${escapeHtml(x.id)}</td>
          <td class="py-2 text-sm">${escapeHtml(x.name)}</td>
          <td class="py-2 text-sm"><span class="text-xs font-semibold px-2 py-0.5 rounded-full ${badgeClass(x.role)}">${x.role}</span></td>
          <td class="py-2 text-sm text-slate-500">${escapeHtml(x.phone)}</td>
          <td class="py-2 text-sm">${verifyControl}</td>
        </tr>
      `;
    })
    .join("");

  return `
    ${renderAdminProgress()}
    <div class="grid sm:grid-cols-3 gap-4 mb-6">
      <div class="card p-5"><p class="text-2xl font-bold">${clients}</p><p class="text-sm text-slate-500">Clients registered</p></div>
      <div class="card p-5"><p class="text-2xl font-bold">${verifiedCount}/${vendors.length}</p><p class="text-sm text-slate-500">Vendors verified</p></div>
      <div class="card p-5"><p class="text-2xl font-bold">${openDisputes.length}</p><p class="text-sm text-slate-500">Open disputes</p></div>
    </div>
    <div class="mb-6">
      <p class="text-sm font-semibold mb-3 flex items-center gap-2"><i class="ti ti-flag"></i> Dispute queue</p>
      <div class="space-y-3">${disputeRows}</div>
    </div>
    <div class="card p-5">
      <p class="text-sm font-semibold mb-3">All registered accounts</p>
      <table class="w-full">
        <thead><tr class="text-left text-xs text-slate-400 uppercase"><th class="pb-2">ID</th><th class="pb-2">Name</th><th class="pb-2">Role</th><th class="pb-2">Phone</th><th class="pb-2">Verification</th></tr></thead>
        <tbody>${userRows}</tbody>
      </table>
    </div>
  `;
}

function render() {
  const root = document.getElementById("root");
  if (state.view === "loading") {
    root.innerHTML = `<p class="text-center text-slate-400 mt-20">Loading&hellip;</p>`;
  } else if (state.view === "auth") {
    root.innerHTML = renderAuth();
  } else {
    root.innerHTML = renderDashboard();
  }
}

init();
</script>
</body>
</html>
