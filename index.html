<style>

.progressTrack{height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden}.progressFill{height:100%;background:#059669;border-radius:999px}.tracking{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.stage{border:1px solid #e2e8f0;background:#f8fafc;color:#94a3b8;border-radius:8px;padding:8px;text-align:center;font-size:11px;font-weight:600}.stage.done{border-color:#a7f3d0;background:#ecfdf5;color:#047857}.stage.active{border-color:#059669;background:#ecfdf5;color:#065f46}

<script>
window.addEventListener("error",e=>showFatal((e.error&&e.error.stack)||e.message||"Unknown JavaScript error"));
window.addEventListener("unhandledrejection",e=>showFatal("Unhandled promise rejection: "+String(e.reason||"Unknown error")));
function showFatal(message){const b=document.getElementById("startup-error"),m=document.getElementById("startup-error-message");if(b&&m){b.style.display="block";m.textContent=message}}
</script>
</head>
<body>
<div id="root" class="max"><div class="card p24"><h1>Lagos Sourcing Platform</h1><p class="muted"><b>Connecting to the backend…</b></p></div></div>
<div id="startup-error" style="display:none;max-width:1050px;margin:16px auto;padding:16px;border:1px solid #fca5a5;background:#fef2f2;color:#7f1d1d;border-radius:12px">
<strong>The app hit an error:</strong><pre id="startup-error-message" style="white-space:pre-wrap"></pre></div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  addDoc,
  setDoc,
  updateDoc,
  query,
  where,
  serverTimestamp,
  Timestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIfq9BAJuEjl8RZcp9ifDy8uIsnN3anDo",
  authDomain: "lagos-sourcing.firebaseapp.com",
  projectId: "lagos-sourcing",
  storageBucket: "lagos-sourcing.firebasestorage.app",
  messagingSenderId: "202595139394",
  appId: "1:202595139394:web:e12a95c787e3b8c360d2db"
};

const SITE_URL = "https://ikechukwuosea.github.io/lagos-sourcing/";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let state = {
  users: [], orders: [], currentUser: null, sessionUser: null,
  view: "loading", authMode: "login", authRole: "client",
  error: "", notice: "", loadingAction: false,
  requestingVendorId: null, requestError: "",
  invoicingOrderId: null, invoiceError: "",
  shippingOrderId: null, shipError: "",
  disputingOrderId: null, disputeError: "",
  searchQuery: "", searchResults: null
};

function escapeHtml(v){const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function formatNaira(n){return "₦"+Number(n||0).toLocaleString("en-NG")}
function asDate(v){
  if(!v) return null;
  if(v instanceof Timestamp) return v.toDate();
  if(v && typeof v.toDate==="function") return v.toDate();
  const d=new Date(v);
  return Number.isNaN(d.getTime())?null:d;
}
function displayDate(v){const d=asDate(v);return d?d.toLocaleDateString():""}
function displayDateTime(v){const d=asDate(v);return d?d.toLocaleString():""}
function categoriesArray(v){return Array.isArray(v)?v:String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}
function friendlyError(err){
  const code=err&&err.code?String(err.code):"";
  if(code.includes("auth/invalid-credential")) return "Incorrect email or password.";
  if(code.includes("auth/email-already-in-use")) return "That email is already registered.";
  if(code.includes("auth/weak-password")) return "Use a stronger password.";
  if(code.includes("auth/unauthorized-domain")) return "This website domain is not authorized in Firebase Authentication.";
  if(code.includes("permission-denied")) return "Permission denied by Firestore security rules.";
  return err&&err.message?err.message:String(err||"Something went wrong.");
}
function userById(id){return state.users.find(u=>u.id===id)}

function profileToUser(id,p){
  return {
    id,
    name:p.fullName||"Unnamed user",
    role:p.role||"client",
    businessName:p.businessName||"",
    market:p.market||"",
    categories:categoriesArray(p.categories),
    verified:!!p.verified,
    phone:p.phone||"",
    createdAt:p.createdAt||null
  };
}

function mapOrder(id,row,history,shipment,dispute){
  return {
    id,
    clientId:row.clientId,
    vendorId:row.vendorId,
    itemDesc:row.itemDesc||"",
    market:row.market||"",
    status:row.status||"requested",
    itemCost:row.itemCost==null?null:Number(row.itemCost),
    deliveryCost:row.deliveryCost==null?null:Number(row.deliveryCost),
    totalCost:row.totalCost==null?null:Number(row.totalCost),
    invoiceNumber:row.invoiceNumber||"",
    invoicedAt:row.invoicedAt||null,
    escrowFundedAt:row.escrowFundedAt||null,
    shipmentProof:row.shipmentProof||"",
    shippedAt:row.shippedAt||null,
    inTransitAt:row.inTransitAt||null,
    completedAt:row.completedAt||null,
    cancelledAt:row.cancelledAt||null,
    cancellationReason:row.cancellationReason||"",
    autoReleased:!!row.autoReleased,
    createdAt:row.createdAt||null,
    statusHistory:(history||[]).map(h=>({status:h.status,at:h.createdAt})),
    shipment:shipment?{
      carrier:shipment.carrier||"",
      tracking_number:shipment.trackingNumber||"",
      shipment_notes:shipment.shipmentNotes||"",
      shipped_at:shipment.shippedAt||null,
      in_transit_at:shipment.inTransitAt||null
    }:null,
    dispute:dispute?{
      reason:dispute.reason||"",
      raisedAt:dispute.createdAt||null,
      status:dispute.status||"open",
      resolution:dispute.resolution||null,
      adminNotes:dispute.adminNotes||"",
      resolvedAt:dispute.resolvedAt||null
    }:null
  };
}

async function getOwnProfile(uid){
  const snap=await getDoc(doc(db,"users",uid));
  if(!snap.exists()) throw new Error("Your Firebase Authentication account has no matching Firestore users profile.");
  return profileToUser(snap.id,snap.data());
}

async function getProfilesForRole(current){
  if(current.role==="admin"){
    const snap=await getDocs(collection(db,"users"));
    return snap.docs.map(d=>profileToUser(d.id,d.data()));
  }
  if(current.role==="client"){
    const q=query(collection(db,"users"),where("role","==","vendor"),where("verified","==",true));
    const snap=await getDocs(q);
    const vendors=snap.docs.map(d=>profileToUser(d.id,d.data()));
    return [current,...vendors.filter(v=>v.id!==current.id)];
  }
  return [current];
}

async function getOrdersForRole(current){
  let snap;
  if(current.role==="admin"){
    snap=await getDocs(collection(db,"orders"));
  }else if(current.role==="client"){
    snap=await getDocs(query(collection(db,"orders"),where("clientId","==",current.id)));
  }else{
    snap=await getDocs(query(collection(db,"orders"),where("vendorId","==",current.id)));
  }
  return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
    const da=asDate(a.createdAt)?.getTime()||0, dbb=asDate(b.createdAt)?.getTime()||0;
    return dbb-da;
  });
}

async function loadRelated(orderId){
  const [hs,ss,ds]=await Promise.all([
    getDocs(query(collection(db,"orderHistory"),where("orderId","==",orderId))),
    getDocs(query(collection(db,"shipments"),where("orderId","==",orderId))),
    getDocs(query(collection(db,"disputes"),where("orderId","==",orderId)))
  ]);
  const history=hs.docs.map(d=>d.data()).sort((a,b)=>(asDate(a.createdAt)?.getTime()||0)-(asDate(b.createdAt)?.getTime()||0));
  const shipment=ss.docs[0]?ss.docs[0].data():null;
  const dispute=ds.docs[0]?ds.docs[0].data():null;
  return {history,shipment,dispute};
}

async function loadData(){
  if(!auth.currentUser) return;
  const current=await getOwnProfile(auth.currentUser.uid);
  state.currentUser=current;
  state.sessionUser=auth.currentUser;
  state.users=await getProfilesForRole(current);
  const baseOrders=await getOrdersForRole(current);
  const related=await Promise.all(baseOrders.map(o=>loadRelated(o.id)));
  state.orders=baseOrders.map((o,i)=>mapOrder(o.id,o,related[i].history,related[i].shipment,related[i].dispute));
}

async function init(){
  try{
    await setPersistence(auth,browserLocalPersistence);
    onAuthStateChanged(auth,async user=>{
      try{
        if(user){
          state.sessionUser=user;
          await loadData();
          state.view="dashboard";
        }else{
          state.users=[];state.orders=[];state.currentUser=null;state.sessionUser=null;
          state.view="auth";
        }
        state.error="";
      }catch(e){
        state.view="auth";
        state.error=friendlyError(e);
      }
      render();
    });
  }catch(e){
    state.view="auth";
    state.error=friendlyError(e);
    render();
  }
}

async function refreshData(){
  if(!auth.currentUser)return;
  state.loadingAction=true;state.error="";render();
  try{await loadData()}catch(e){state.error=friendlyError(e)}
  state.loadingAction=false;render();
}

function switchAuthMode(mode){state.authMode=mode;state.error="";state.notice="";render()}
function switchAuthRole(role){state.authRole=role;state.error="";render()}

async function handleSignup(e){
  e.preventDefault();state.error="";state.notice="";
  const name=document.getElementById("su-name").value.trim();
  const email=document.getElementById("su-email").value.trim();
  const phone=document.getElementById("su-phone").value.trim();
  const password=document.getElementById("su-password").value;
  const business=document.getElementById("su-business")?document.getElementById("su-business").value.trim():"";
  const market=document.getElementById("su-market")?document.getElementById("su-market").value:"";
  const categories=document.getElementById("su-categories")?document.getElementById("su-categories").value.trim():"";
  if(!name||!email||!password){state.error="Enter your name, email and password.";render();return}
  if(password.length<8){state.error="Use a password with at least 8 characters.";render();return}
  state.loadingAction=true;render();
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,password);
    const profile={
      fullName:name,
      role:state.authRole,
      verified:false,
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    };
    if(phone) profile.phone=phone;
    if(state.authRole==="vendor"){
      profile.businessName=business||name;
      profile.market=market||"Computer Village (Ikeja)";
      profile.categories=categories;
    }
    await setDoc(doc(db,"users",cred.user.uid),profile);
    state.sessionUser=cred.user;
    await loadData();
    state.view="dashboard";
    state.notice=state.authRole==="vendor"?"Account created. An admin must verify your vendor profile before clients can see it.":"Account created successfully.";
  }catch(e){
    state.error=friendlyError(e);
  }
  state.loadingAction=false;render();
}

async function handleLogin(e){
  e.preventDefault();state.error="";state.notice="";
  const email=document.getElementById("li-email").value.trim();
  const password=document.getElementById("li-password").value;
  if(!email||!password){state.error="Enter your email and password.";render();return}
  state.loadingAction=true;render();
  try{
    const cred=await signInWithEmailAndPassword(auth,email,password);
    state.sessionUser=cred.user;
    await loadData();
    state.view="dashboard";
  }catch(e){state.error=friendlyError(e)}
  state.loadingAction=false;render();
}

async function handleLogout(){
  try{await signOut(auth)}catch(e){console.warn(e)}
  state.users=[];state.orders=[];state.currentUser=null;state.sessionUser=null;
  state.view="auth";state.authMode="login";state.error="";state.notice="";render();
}

async function addHistory(orderId,status){
  await addDoc(collection(db,"orderHistory"),{
    orderId,
    status,
    actorId:auth.currentUser.uid,
    createdAt:serverTimestamp()
  });
}

async function runAction(work, fallbackStateKey){
  state.error="";if(fallbackStateKey)state[fallbackStateKey]="";state.loadingAction=true;render();
  try{
    await work();
    await loadData();
  }catch(e){
    if(fallbackStateKey)state[fallbackStateKey]=friendlyError(e);
    else state.error=friendlyError(e);
  }
  state.loadingAction=false;render();
}

async function toggleVendorVerified(id){
  const u=userById(id);if(!u)return;
  await runAction(async()=>{
    await updateDoc(doc(db,"users",id),{verified:!u.verified,updatedAt:serverTimestamp()});
  });
}

function runVendorSearch(e){
  e.preventDefault();
  const qv=document.getElementById("vendor-search").value.trim().toLowerCase();
  state.searchQuery=qv;
  if(!qv){state.searchResults=null;render();return}
  const tokens=qv.split(/\s+/).filter(t=>t.length>1);
  const vendors=state.users.filter(u=>u.role==="vendor"&&u.verified);
  state.searchResults=vendors.map(v=>{
    const hay=[v.businessName,v.name,v.market,...v.categories].join(" ").toLowerCase();
    const score=tokens.reduce((n,t)=>n+(hay.includes(t)?1:0),0);
    return {vendor:v,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>x.vendor);
  render();
}
function clearVendorSearch(){state.searchQuery="";state.searchResults=null;render()}

function openRequestForm(id){state.requestingVendorId=id;state.requestError="";render()}
function closeRequestForm(){state.requestingVendorId=null;state.requestError="";render()}
async function submitRequest(e){
  e.preventDefault();
  const item=document.getElementById("req-item").value.trim();
  if(!item){state.requestError="Describe the item you want.";render();return}
  const vendorId=state.requestingVendorId;
  const vendor=userById(vendorId);
  await runAction(async()=>{
    const ref=await addDoc(collection(db,"orders"),{
      clientId:auth.currentUser.uid,
      vendorId,
      itemDesc:item,
      market:vendor?vendor.market:"",
      status:"requested",
      autoReleased:false,
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await addHistory(ref.id,"requested");
    state.requestingVendorId=null;
  },"requestError");
}

function openInvoiceForm(id){state.invoicingOrderId=id;state.invoiceError="";render()}
function closeInvoiceForm(){state.invoicingOrderId=null;state.invoiceError="";render()}
async function submitInvoice(e){
  e.preventDefault();
  const item=Number(document.getElementById("inv-item-cost").value);
  const delivery=Number(document.getElementById("inv-delivery-cost").value);
  if(!Number.isFinite(item)||item<=0){state.invoiceError="Enter a valid item cost.";render();return}
  if(!Number.isFinite(delivery)||delivery<0){state.invoiceError="Enter a valid delivery cost.";render();return}
  const id=state.invoicingOrderId;
  await runAction(async()=>{
    const invoice="INV-"+crypto.randomUUID().replace(/-/g,"").slice(0,8).toUpperCase();
    await updateDoc(doc(db,"orders",id),{
      status:"invoiced",
      itemCost:item,
      deliveryCost:delivery,
      totalCost:item+delivery,
      invoiceNumber:invoice,
      invoicedAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await addHistory(id,"invoiced");
    state.invoicingOrderId=null;
  },"invoiceError");
}

async function declineRequest(id){
  if(!confirm("Decline this sourcing request?"))return;
  await runAction(async()=>{
    await updateDoc(doc(db,"orders",id),{status:"declined",updatedAt:serverTimestamp()});
    await addHistory(id,"declined");
  });
}

async function cancelOrder(id){
  if(!confirm("Cancel this order before escrow funding?"))return;
  await runAction(async()=>{
    await updateDoc(doc(db,"orders",id),{
      status:"cancelled",
      cancelledAt:serverTimestamp(),
      cancellationReason:"Cancelled by client",
      updatedAt:serverTimestamp()
    });
    await addHistory(id,"cancelled");
  });
}

async function fundEscrow(id){
  if(!confirm("This is still a SIMULATED escrow action. Continue for testing?"))return;
  await runAction(async()=>{
    await updateDoc(doc(db,"orders",id),{
      status:"escrow_funded",
      escrowFundedAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await addHistory(id,"escrow_funded");
  });
}

function openShipForm(id){state.shippingOrderId=id;state.shipError="";render()}
function closeShipForm(){state.shippingOrderId=null;state.shipError="";render()}
async function submitShipment(e){
  e.preventDefault();
  const carrier=document.getElementById("ship-carrier").value.trim();
  const tracking=document.getElementById("ship-tracking").value.trim();
  const notes=document.getElementById("ship-notes").value.trim();
  if(!carrier&&!tracking&&!notes){state.shipError="Enter carrier, tracking number, or shipment notes.";render();return}
  const id=state.shippingOrderId;
  await runAction(async()=>{
    const parts=[];
    if(carrier)parts.push("Carrier: "+carrier);
    if(tracking)parts.push("Tracking: "+tracking);
    if(notes)parts.push(notes);
    await updateDoc(doc(db,"orders",id),{
      status:"shipped",
      shipmentProof:parts.join(" | "),
      shippedAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await setDoc(doc(db,"shipments",id),{
      orderId:id,
      vendorId:auth.currentUser.uid,
      carrier,
      trackingNumber:tracking,
      shipmentNotes:notes,
      shippedAt:serverTimestamp(),
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await addHistory(id,"shipped");
    state.shippingOrderId=null;
  },"shipError");
}

async function markInTransit(id){
  await runAction(async()=>{
    await updateDoc(doc(db,"orders",id),{
      status:"in_transit",
      inTransitAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await updateDoc(doc(db,"shipments",id),{
      inTransitAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await addHistory(id,"in_transit");
  });
}

async function confirmReceipt(id){
  if(!confirm("Confirm that you received this order?"))return;
  await runAction(async()=>{
    await updateDoc(doc(db,"orders",id),{
      status:"completed",
      completedAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await addHistory(id,"completed");
  });
}

function openDisputeForm(id){state.disputingOrderId=id;state.disputeError="";render()}
function closeDisputeForm(){state.disputingOrderId=null;state.disputeError="";render()}
async function submitDispute(e){
  e.preventDefault();
  const reason=document.getElementById("dispute-reason").value.trim();
  if(!reason){state.disputeError="Explain what went wrong.";render();return}
  const id=state.disputingOrderId;
  await runAction(async()=>{
    await updateDoc(doc(db,"orders",id),{status:"disputed",updatedAt:serverTimestamp()});
    await setDoc(doc(db,"disputes",id),{
      orderId:id,
      raisedBy:auth.currentUser.uid,
      reason,
      status:"open",
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await addHistory(id,"disputed");
    state.disputingOrderId=null;
  },"disputeError");
}

async function resolveDispute(id,resolution){
  const el=document.getElementById("dispute-notes-"+id);
  const notes=el?el.value.trim():"";
  if(!confirm(resolution==="release"?"Release the order to the vendor?":"Resolve in the client's favour?"))return;
  await runAction(async()=>{
    const orderUpdate={status:resolution==="release"?"completed":"refunded",updatedAt:serverTimestamp()};
    if(resolution==="release")orderUpdate.completedAt=serverTimestamp();
    await updateDoc(doc(db,"orders",id),orderUpdate);
    await updateDoc(doc(db,"disputes",id),{
      status:"resolved",
      resolution,
      adminNotes:notes,
      resolvedAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    await addHistory(id,orderUpdate.status);
  });
}

function statusBadge(status){
  const m={requested:["b-slate","Awaiting quote"],invoiced:["b-blue","Invoiced"],escrow_funded:["b-green","Escrow funded"],shipped:["b-amber","Shipped"],in_transit:["b-orange","In transit"],completed:["b-green","Completed"],disputed:["b-red","Disputed"],refunded:["b-slate","Refunded"],declined:["b-red","Declined"],cancelled:["b-slate","Cancelled"]};
  const x=m[status]||["b-slate",status];return `<span class="badge ${x[0]}">${escapeHtml(x[1])}</span>`;
}
function roleBadge(role){return `<span class="badge ${role}">${escapeHtml(role)}</span>`}

function renderInvoice(o,vendor,client){
  if(o.itemCost==null)return "";
  return `<div class="card p16 mt12" style="background:#f8fafc">
    <div class="flex between start"><div><div class="small faint">INVOICE</div><div class="mono semibold">${escapeHtml(o.invoiceNumber||"")}</div></div><div class="small faint">${displayDate(o.invoicedAt)}</div></div>
    <div class="text14 muted mt8">Vendor: ${escapeHtml(vendor?(vendor.businessName||vendor.name):"Unknown")}</div>
    <div class="text14 muted">Client: ${escapeHtml(client?client.name:"Unknown")}</div>
    <div class="borderTop pt12 mt12 text14">
      <div class="flex between"><span>Item cost</span><b>${formatNaira(o.itemCost)}</b></div>
      <div class="flex between mt4"><span>Delivery</span><b>${formatNaira(o.deliveryCost)}</b></div>
      <div class="flex between mt8 bold"><span>Total</span><span>${formatNaira(o.totalCost)}</span></div>
    </div></div>`;
}
function renderTracking(o){
  const stages=[["requested","Request"],["invoiced","Quote"],["escrow_funded","Escrow"],["sourcing","Sourcing"],["shipped","Shipped"],["in_transit","In transit"],["completed","Completed"]];
  const rank={requested:0,invoiced:1,escrow_funded:3,shipped:4,in_transit:5,completed:6,disputed:5,refunded:6,declined:-1,cancelled:-1};
  const current=rank[o.status]??0;
  return `<div class="card p16 mt16"><div class="flex between center mb12"><b class="text14">Goods Flow</b><button class="action small" onclick="printOrderReceipt('${o.id}')">Print receipt</button></div>
    <div class="tracking">${stages.map(([k,label],i)=>{const active=(o.status==="escrow_funded"&&k==="sourcing")||o.status===k;const done=current>i||(o.status==="escrow_funded"&&i<=2);return `<div class="stage ${active?"active":done?"done":""}">${done&&!active?"✓ ":""}${label}</div>`}).join("")}</div>
    ${o.shipment?`<div class="small muted mt12"><b>Carrier:</b> ${escapeHtml(o.shipment.carrier||"—")} &nbsp; <b>Tracking:</b> ${escapeHtml(o.shipment.tracking_number||"—")}</div>`:""}
    ${o.shipmentProof?`<div class="small muted mt8"><b>Shipment details:</b> ${escapeHtml(o.shipmentProof)}</div>`:""}
  </div>`;
}
function printOrderReceipt(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;const c=userById(o.clientId),v=userById(o.vendorId);
  const body=`<!doctype html><html><head><meta charset="utf-8"><title>Receipt ${escapeHtml(o.id)}</title><style>body{font-family:Arial;padding:32px;color:#222}table{width:100%;border-collapse:collapse}td{padding:9px;border-bottom:1px solid #ddd}.total{font-size:18px;font-weight:bold}</style></head><body><h1>Lagos Sourcing — Order Receipt</h1><p><b>Order:</b> ${escapeHtml(o.id)}</p><p><b>Date:</b> ${displayDateTime(o.createdAt)}</p><table><tr><td>Client</td><td>${escapeHtml(c?c.name:"Unknown")}</td></tr><tr><td>Vendor</td><td>${escapeHtml(v?(v.businessName||v.name):"Unknown")}</td></tr><tr><td>Item</td><td>${escapeHtml(o.itemDesc)}</td></tr><tr><td>Status</td><td>${escapeHtml(o.status)}</td></tr>${o.itemCost!=null?`<tr><td>Item cost</td><td>${formatNaira(o.itemCost)}</td></tr><tr><td>Delivery</td><td>${formatNaira(o.deliveryCost)}</td></tr><tr class="total"><td>Total</td><td>${formatNaira(o.totalCost)}</td></tr>`:""}${o.shipmentProof?`<tr><td>Shipment</td><td>${escapeHtml(o.shipmentProof)}</td></tr>`:""}</table><p style="margin-top:24px;font-size:12px;color:#666">Payment/escrow is still simulated in this development version.</p><script>window.onload=()=>window.print();<\/script></body></html>`;
  const w=window.open("","_blank","width=800,height=900");if(!w){alert("Allow pop-ups to print.");return}w.document.write(body);w.document.close();
}

function renderAuth(){
  const vendorFields=state.authMode==="signup"&&state.authRole==="vendor"?`
    <div><label class="text14 semibold">Business name</label><input id="su-business" placeholder="Business name"></div>
    <div><label class="text14 semibold">Primary market</label><select id="su-market"><option>Computer Village (Ikeja)</option><option>Balogun Market (Island)</option><option>Alaba International Market</option><option>Yaba Tech Market</option></select></div>
    <div><label class="text14 semibold">What do you sell?</label><input id="su-categories" placeholder="laptops, phones, accessories"></div>`:"";
  const tabs=state.authMode==="signup"?`<div class="flex gap8 mb16"><button type="button" class="${state.authRole==="client"?"btn-primary":"action"}" style="flex:1;padding:10px;border-radius:8px" onclick="switchAuthRole('client')">I'm a client</button><button type="button" class="${state.authRole==="vendor"?"btn-primary":"action"}" style="flex:1;padding:10px;border-radius:8px" onclick="switchAuthRole('vendor')">I'm a vendor</button></div>`:"";
  return `<div class="auth">
    <div class="centerText mb24"><h1>Lagos Sourcing Platform</h1><p class="muted">Shared accounts and order tracking backed by Firebase.</p></div>
    <div class="card p20 mb16"><div class="notice"><b>Firebase connected.</b> Accounts use email/password authentication and Firestore security rules.</div><div class="warn mt12"><b>Development warning:</b> the “fund escrow” button still simulates payment. Do not use this build for real money yet.</div></div>
    <div class="card p24">${tabs}
      ${state.notice?`<div class="notice mb16">${escapeHtml(state.notice)}</div>`:""}${state.error?`<div class="error mb16">${escapeHtml(state.error)}</div>`:""}
      ${state.authMode==="signup"?`
      <form onsubmit="handleSignup(event)" class="grid">
        <div><label class="text14 semibold">Full name</label><input id="su-name" required></div>
        <div><label class="text14 semibold">Email</label><input id="su-email" type="email" required></div>
        <div><label class="text14 semibold">Phone / WhatsApp (optional)</label><input id="su-phone" type="tel"></div>
        <div><label class="text14 semibold">Password</label><input id="su-password" type="password" minlength="8" required></div>
        ${vendorFields}
        <button class="btn-primary" style="padding:11px;border-radius:8px" ${state.loadingAction?"disabled":""}>${state.loadingAction?"Creating account…":"Create account"}</button>
      </form><p class="centerText text14 muted mt16">Already registered? <button class="action" onclick="switchAuthMode('login')">Log in</button></p>`:
      `<form onsubmit="handleLogin(event)" class="grid">
        <div><label class="text14 semibold">Email</label><input id="li-email" type="email" required></div>
        <div><label class="text14 semibold">Password</label><input id="li-password" type="password" required></div>
        <button class="btn-primary" style="padding:11px;border-radius:8px" ${state.loadingAction?"disabled":""}>${state.loadingAction?"Logging in…":"Log in"}</button>
      </form><p class="centerText text14 muted mt16">New here? <button class="action" onclick="switchAuthMode('signup')">Create an account</button></p>`}
    </div></div>`;
}

function renderClientPanels(u){
  const vendors=state.users.filter(x=>x.role==="vendor"&&x.verified);
  const shown=state.searchResults===null?vendors:state.searchResults;
  const my=state.orders.filter(o=>o.clientId===u.id);
  const requestBox=state.requestingVendorId?(()=>{const v=userById(state.requestingVendorId);return `<div class="card p20 mb16" style="border:2px solid #14312B"><b>Request an item from ${escapeHtml(v?(v.businessName||v.name):"vendor")}</b><form onsubmit="submitRequest(event)" class="grid mt12"><textarea id="req-item" rows="3" placeholder="Describe the exact item you want"></textarea>${state.requestError?`<div class="error">${escapeHtml(state.requestError)}</div>`:""}<div class="flex gap8"><button class="btn-primary action">Send request</button><button type="button" class="action" onclick="closeRequestForm()">Close</button></div></form></div>`})():"";
  const vendorCards=shown.length?shown.map(v=>`<div class="card p16"><div class="flex between start gap12"><div><b>${escapeHtml(v.businessName||v.name)}</b><div class="small muted">${escapeHtml(v.market||"")}</div><div class="small faint mt4">${escapeHtml(v.categories.join(", "))}</div></div><button class="btn-primary action" onclick="openRequestForm('${v.id}')">Request item</button></div></div>`).join(""):`<div class="muted text14">No matching verified vendors.</div>`;
  const orders=my.length?my.map(o=>{
    const v=userById(o.vendorId),disputing=state.disputingOrderId===o.id;
    const deliveryActions=["shipped","in_transit"].includes(o.status)?`<div class="borderTop pt12 mt12">${disputing?`<form onsubmit="submitDispute(event)" class="grid"><textarea id="dispute-reason" rows="2" placeholder="Explain the problem"></textarea>${state.disputeError?`<div class="error">${escapeHtml(state.disputeError)}</div>`:""}<div class="flex gap8"><button class="redbtn action">Submit dispute</button><button type="button" class="action" onclick="closeDisputeForm()">Close</button></div></form>`:`<div class="flex gap8 wrap"><button class="btn-primary action" onclick="confirmReceipt('${o.id}')">Confirm received</button><button class="action danger" onclick="openDisputeForm('${o.id}')">Raise dispute</button></div>`}</div>`:"";
    return `<div class="card p16"><div class="flex between start"><div><b>${escapeHtml(o.itemDesc)}</b><div class="small muted">${escapeHtml(v?(v.businessName||v.name):"Vendor")} · ${displayDate(o.createdAt)}</div></div>${statusBadge(o.status)}</div>
      ${renderInvoice(o,v,u)}
      ${["requested","invoiced"].includes(o.status)?`<button class="action danger mt12" onclick="cancelOrder('${o.id}')">Cancel order</button>`:""}
      ${o.status==="invoiced"?`<div class="warn mt12">Payment is simulated in this build.</div><button class="btn-primary action mt8" onclick="fundEscrow('${o.id}')">Simulate escrow funding</button>`:""}
      ${o.status==="escrow_funded"?`<div class="notice mt12">Escrow state recorded. Vendor can now source and ship.</div>`:""}
      ${deliveryActions}
      ${o.status==="disputed"?`<div class="error mt12">Dispute is open and awaiting admin review.</div>`:""}
      ${o.status==="refunded"?`<div class="notice mt12">Dispute resolved in the client's favour.</div>`:""}
      ${o.status==="cancelled"?`<div class="muted text14 mt12">Cancelled before escrow funding.</div>`:""}
      ${renderTracking(o)}</div>`;
  }).join(""):`<div class="muted text14">No orders yet.</div>`;
  return `${requestBox}<div class="grid g2"><div><div class="card p16 mb16"><b>Find a verified vendor</b><form onsubmit="runVendorSearch(event)" class="flex gap8 mt12"><input id="vendor-search" value="${escapeHtml(state.searchQuery)}" placeholder="e.g. MacBook, phone, electronics"><button class="btn-primary action">Search</button>${state.searchResults!==null?`<button type="button" class="action" onclick="clearVendorSearch()">Clear</button>`:""}</form></div><div class="grid">${vendorCards}</div></div><div><h3>My orders</h3><div class="grid">${orders}</div></div></div>`;
}

function renderVendorPanels(u){
  if(!u.verified)return `<div class="card p24 centerText"><h3>Awaiting admin verification</h3><p class="muted">Your account works, but clients will only see your vendor profile after an admin verifies it.</p></div>`;
  const my=state.orders.filter(o=>o.vendorId===u.id),requested=my.filter(o=>o.status==="requested"),others=my.filter(o=>o.status!=="requested");
  const newRows=requested.length?requested.map(o=>{const c=userById(o.clientId),open=state.invoicingOrderId===o.id;return `<div class="card p16"><div class="flex between start"><div><b>${escapeHtml(o.itemDesc)}</b><div class="small muted">From ${escapeHtml(c?c.name:"Client")}</div></div>${statusBadge(o.status)}</div>${open?`<form onsubmit="submitInvoice(event)" class="grid g2 mt12"><div><label class="small">Item cost (₦)</label><input id="inv-item-cost" type="number" min="0" step="0.01"></div><div><label class="small">Delivery (₦)</label><input id="inv-delivery-cost" type="number" min="0" step="0.01"></div>${state.invoiceError?`<div class="error" style="grid-column:1/-1">${escapeHtml(state.invoiceError)}</div>`:""}<div class="flex gap8" style="grid-column:1/-1"><button class="btn-primary action">Generate invoice</button><button type="button" class="action" onclick="closeInvoiceForm()">Close</button></div></form>`:`<div class="flex gap8 mt12"><button class="btn-primary action" onclick="openInvoiceForm('${o.id}')">Quote & invoice</button><button class="action" onclick="declineRequest('${o.id}')">Decline</button></div>`}</div>`}).join(""):`<div class="muted text14">No new requests.</div>`;
  const rows=others.length?others.map(o=>{const c=userById(o.clientId),ship=state.shippingOrderId===o.id;return `<div class="card p16"><div class="flex between start"><div><b>${escapeHtml(o.itemDesc)}</b><div class="small muted">${escapeHtml(c?c.name:"Client")}</div></div>${statusBadge(o.status)}</div>${renderInvoice(o,u,c)}
    ${o.status==="invoiced"?`<div class="muted text14 mt12">Waiting for the client to fund escrow.</div>`:""}
    ${o.status==="escrow_funded"?(ship?`<form onsubmit="submitShipment(event)" class="grid mt12"><div><label class="small">Carrier</label><input id="ship-carrier" placeholder="Courier/company"></div><div><label class="small">Tracking number</label><input id="ship-tracking" placeholder="Tracking number"></div><div><label class="small">Shipment notes</label><textarea id="ship-notes" rows="2"></textarea></div>${state.shipError?`<div class="error">${escapeHtml(state.shipError)}</div>`:""}<div class="flex gap8"><button class="btn-primary action">Mark shipped</button><button type="button" class="action" onclick="closeShipForm()">Close</button></div></form>`:`<button class="btn-primary action mt12" onclick="openShipForm('${o.id}')">Log shipment</button>`):""}
    ${o.status==="shipped"?`<button class="action mt12" onclick="markInTransit('${o.id}')">Mark in transit</button>`:""}
    ${o.status==="disputed"?`<div class="error mt12">Client dispute: ${escapeHtml(o.dispute?o.dispute.reason:"")}</div>`:""}
    ${renderTracking(o)}</div>`}).join(""):`<div class="muted text14">No quoted/active orders.</div>`;
  return `<div class="grid g2"><div><h3>New requests</h3><div class="grid">${newRows}</div></div><div><h3>Quoted / active</h3><div class="grid">${rows}</div></div></div>`;
}

function renderAdminProgress(){
  const total=state.orders.length,completed=state.orders.filter(o=>o.status==="completed").length,active=state.orders.filter(o=>!["completed","cancelled","declined","refunded"].includes(o.status)).length;
  const percent=total?Math.round(completed/total*100):0;
  const stages=[["requested","Requested"],["invoiced","Invoiced"],["escrow_funded","Escrow funded"],["shipped","Shipped"],["in_transit","In transit"],["completed","Completed"]];
  return `<div class="card p20 mb24"><div class="flex between start"><div><div class="small faint">BACKEND OPERATIONS</div><h3 style="margin:4px 0">Platform progress</h3><div class="small muted">These counts are now loaded from the shared database.</div></div><b style="color:#047857">${percent}% completed</b></div><div class="grid g3 mt16"><div class="card p12"><b>${total}</b><div class="small muted">Total orders</div></div><div class="card p12"><b>${active}</b><div class="small muted">Active</div></div><div class="card p12"><b>${completed}</b><div class="small muted">Completed</div></div></div><div class="mt16">${stages.map(([s,l])=>{const c=state.orders.filter(o=>o.status===s).length,w=total?Math.round(c/total*100):0;return `<div class="mb12"><div class="flex between small"><span>${l}</span><b>${c}</b></div><div class="progressTrack mt4"><div class="progressFill" style="width:${w}%"></div></div></div>`}).join("")}</div></div>`;
}
function renderAdminPanels(){
  const vendors=state.users.filter(u=>u.role==="vendor"),clients=state.users.filter(u=>u.role==="client"),disputes=state.orders.filter(o=>o.status==="disputed");
  const disputeRows=disputes.length?disputes.map(o=>{const c=userById(o.clientId),v=userById(o.vendorId);return `<div class="card p16"><b>${escapeHtml(o.itemDesc)}</b><div class="small muted mt4">Client: ${escapeHtml(c?c.name:"Unknown")} · Vendor: ${escapeHtml(v?(v.businessName||v.name):"Unknown")}</div><div class="error mt12">${escapeHtml(o.dispute?o.dispute.reason:"No reason")}</div><textarea id="dispute-notes-${o.id}" class="mt12" rows="2" placeholder="Admin notes"></textarea><div class="flex gap8 mt8"><button class="btn-primary action" onclick="resolveDispute('${o.id}','release')">Release to vendor</button><button class="redbtn action" onclick="resolveDispute('${o.id}','refund')">Refund client</button></div></div>`}).join(""):`<div class="muted text14">No open disputes.</div>`;
  const rows=state.users.map(u=>`<tr><td class="mono small">${escapeHtml(u.id)}</td><td>${escapeHtml(u.name)}</td><td>${roleBadge(u.role)}</td><td>${escapeHtml(u.businessName||"—")}</td><td>${u.role==="vendor"?`<button class="action small ${u.verified?"verifyDone":"verifyPending"}" onclick="toggleVendorVerified('${u.id}')">${u.verified?"Verified ✓":"Verify now"}</button>`:"—"}</td></tr>`).join("");
  return `${renderAdminProgress()}<div class="grid g3 mb24"><div class="card p16"><b>${clients.length}</b><div class="small muted">Clients</div></div><div class="card p16"><b>${vendors.filter(v=>v.verified).length}/${vendors.length}</b><div class="small muted">Verified vendors</div></div><div class="card p16"><b>${disputes.length}</b><div class="small muted">Open disputes</div></div></div><h3>Dispute queue</h3><div class="grid mb24">${disputeRows}</div><div class="card p16"><h3>Registered profiles</h3><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Business</th><th>Verification</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function renderDashboard(){
  const u=state.currentUser;if(!u)return renderAuth();
  return `<div><div class="flex between center mb24"><div><div class="small faint">${escapeHtml(u.role.toUpperCase())} DASHBOARD</div><h1 style="margin:4px 0">Welcome, ${escapeHtml(u.name)}</h1></div><div class="flex gap8 center">${roleBadge(u.role)}<button class="action iconbtn" onclick="refreshData()" ${state.loadingAction?"disabled":""} title="Refresh" aria-label="Refresh"><span class="${state.loadingAction?"spin":""}">↻</span></button><button class="action" onclick="handleLogout()">Log out</button></div></div>${state.error?`<div class="error mb16">${escapeHtml(state.error)}</div>`:""}${u.role==="client"?renderClientPanels(u):u.role==="vendor"?renderVendorPanels(u):renderAdminPanels(u)}</div>`;
}
function render(){
  const root=document.getElementById("root");
  if(state.view==="loading")root.innerHTML=`<div class="card p24">Connecting to the backend…</div>`;
  else if(state.view==="auth")root.innerHTML=renderAuth();
  else root.innerHTML=renderDashboard();
}


Object.assign(window,{
  switchAuthMode,switchAuthRole,handleSignup,handleLogin,handleLogout,refreshData,
  toggleVendorVerified,runVendorSearch,clearVendorSearch,openRequestForm,closeRequestForm,
  submitRequest,openInvoiceForm,closeInvoiceForm,submitInvoice,declineRequest,cancelOrder,
  fundEscrow,openShipForm,closeShipForm,submitShipment,markInTransit,confirmReceipt,
  openDisputeForm,closeDisputeForm,submitDispute,resolveDispute,printOrderReceipt
});

init();
</script>

</body>
