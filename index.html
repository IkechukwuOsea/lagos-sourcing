  view: "loading", authMode: "login", authRole: "client",
  error: "", notice: "", loadingAction: false,
  requestingVendorId: null, requestError: "",
  invoicingOrderId: null, invoiceError: "",
  shippingOrderId: null, shipError: "",
  disputingOrderId: null, disputeError: "",
  searchQuery: "", searchResults: null,
  settingsOpen: false, settingsError: "", profileImageDraft: "",
  relatedByOrder: {}, relatedLoaded: new Set(), relatedLoading: new Set(), openFlowIds: new Set()
};

function escapeHtml(v){
  return String(v==null?"":v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function formatNaira(n){return "₦"+Number(n||0).toLocaleString("en-NG")}
function asDate(v){
  if(!v) return null;
  if(v instanceof Timestamp) return v.toDate();
  if(v && typeof v.toDate==="function") return v.toDate();
  const d=new Date(v);
  return Number.isNaN(d.getTime())?null:d;
}
function displayDate(v){const d=asDate(v);return d?d.toLocaleDateString():""}
function displayDateTime(v){const d=asDate(v);return d?d.toLocaleString():""}
function categoriesArray(v){return Array.isArray(v)?v:String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}
function friendlyError(err){
  const code=err&&err.code?String(err.code):"";
  if(code.includes("auth/invalid-credential")) return "Incorrect email or password.";
  if(code.includes("auth/email-already-in-use")) return "That email is already registered.";
  if(code.includes("auth/weak-password")) return "Use a stronger password.";
  if(code.includes("auth/unauthorized-domain")) return "This website domain is not authorized in Firebase Authentication.";
  if(code.includes("permission-denied")) return "Permission denied by Firestore security rules.";
  return err&&err.message?err.message:String(err||"Something went wrong.");
}
function userById(id){return state.users.find(u=>u.id===id)}

function profileToUser(id,p){
  return {
    id,
    name:p.fullName||"Unnamed user",
    role:p.role||"client",
    businessName:p.businessName||"",
    market:p.market||"",
    categories:categoriesArray(p.categories),
    verified:!!p.verified,
    phone:p.phone||"",
    profileImage:p.profileImage||"",
    createdAt:p.createdAt||null
  };
}

function mapOrder(id,row,related){
  const shipment=related&&related.shipment?related.shipment:null;
  const dispute=related&&related.dispute?related.dispute:null;
  return {
    id,
    clientId:row.clientId,
    clientName:row.clientName||"",
    vendorId:row.vendorId,
    vendorName:row.vendorName||"",
    itemDesc:row.itemDesc||"",
    market:row.market||"",
    status:row.status||"requested",
    itemCost:row.itemCost==null?null:Number(row.itemCost),
    deliveryCost:row.deliveryCost==null?null:Number(row.deliveryCost),
    totalCost:row.totalCost==null?null:Number(row.totalCost),
    invoiceNumber:row.invoiceNumber||"",
    invoicedAt:row.invoicedAt||null,
    escrowFundedAt:row.escrowFundedAt||null,
    shipmentProof:row.shipmentProof||"",
    shippedAt:row.shippedAt||null,
    inTransitAt:row.inTransitAt||null,
    completedAt:row.completedAt||null,
    cancelledAt:row.cancelledAt||null,
    cancellationReason:row.cancellationReason||"",
    autoReleased:!!row.autoReleased,
    createdAt:row.createdAt||null,
    updatedAt:row.updatedAt||null,
    shipment:shipment?{
      carrier:shipment.carrier||"",
      tracking_number:shipment.trackingNumber||"",
      shipment_notes:shipment.shipmentNotes||"",
      shipped_at:shipment.shippedAt||null,
      in_transit_at:shipment.inTransitAt||null
    }:null,
    dispute:dispute?{
      reason:dispute.reason||"",
      raisedAt:dispute.createdAt||null,
      status:dispute.status||"open",
      resolution:dispute.resolution||null,
      adminNotes:dispute.adminNotes||"",
      resolvedAt:dispute.resolvedAt||null
    }:null
  };
}

async function getOwnProfile(uid){
  const snap=await getDoc(doc(db,"users",uid));
  if(!snap.exists()) throw new Error("Your Firebase Authentication account has no matching Firestore users profile.");
  return profileToUser(snap.id,snap.data());
}

async function getProfilesForRole(current){
  if(current.role==="admin"){
    const snap=await getDocs(collection(db,"users"));
    return snap.docs.map(d=>profileToUser(d.id,d.data()));
  }
  if(current.role==="client"){
    const q=query(collection(db,"users"),where("role","==","vendor"),where("verified","==",true));
    const snap=await getDocs(q);
    const vendors=snap.docs.map(d=>profileToUser(d.id,d.data()));
    return [current,...vendors.filter(v=>v.id!==current.id)];
  }
  return [current];
}

async function getOrdersForRole(current){
  let snap;
  if(current.role==="admin"){
    snap=await getDocs(collection(db,"orders"));
  }else if(current.role==="client"){
    snap=await getDocs(query(collection(db,"orders"),where("clientId","==",current.id)));
  }else{
    snap=await getDocs(query(collection(db,"orders"),where("vendorId","==",current.id)));
  }
  return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
    const da=asDate(a.createdAt)?.getTime()||0, dbb=asDate(b.createdAt)?.getTime()||0;
    return dbb-da;
  });
}

function resetRelatedCache(){
  state.relatedByOrder={};
  state.relatedLoaded=new Set();
  state.relatedLoading=new Set();
  state.openFlowIds=new Set();
}

function searchVerifiedVendors(queryText,users=state.users){
  const qv=String(queryText||"").trim().toLowerCase();
  if(!qv) return null;
  const tokens=qv.split(/\s+/).filter(t=>t.length>1);
  if(!tokens.length) return [];
  return users.filter(u=>u.role==="vendor"&&u.verified).map(v=>{
    const hay=[v.businessName,v.name,v.market,...v.categories].join(" ").toLowerCase();
    const score=tokens.reduce((n,t)=>n+(hay.includes(t)?1:0),0);
    return {vendor:v,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>x.vendor);
}

function reconcileUiState(){
  if(state.currentUser&&state.currentUser.role==="client"){
    if(state.searchResults!==null) state.searchResults=searchVerifiedVendors(state.searchQuery,state.users);
    if(state.requestingVendorId&&!state.users.some(u=>u.id===state.requestingVendorId&&u.role==="vendor"&&u.verified)){
      state.requestingVendorId=null;state.requestError="";
    }
    if(state.disputingOrderId&&!state.orders.some(o=>o.id===state.disputingOrderId&&["shipped","in_transit"].includes(o.status))){
      state.disputingOrderId=null;state.disputeError="";
    }
  }
  if(state.currentUser&&state.currentUser.role==="vendor"){
    if(state.invoicingOrderId&&!state.orders.some(o=>o.id===state.invoicingOrderId&&o.status==="requested")){
      state.invoicingOrderId=null;state.invoiceError="";
    }
    if(state.shippingOrderId&&!state.orders.some(o=>o.id===state.shippingOrderId&&o.status==="escrow_funded")){
      state.shippingOrderId=null;state.shipError="";
    }
  }
  const validIds=new Set(state.orders.map(o=>o.id));
  state.openFlowIds=new Set([...state.openFlowIds].filter(id=>validIds.has(id)));
}

async function loadOrderRelated(orderId,status){
  const needsShipment=["shipped","in_transit","completed","disputed","refunded"].includes(status);
  const needsDispute=["disputed","refunded"].includes(status);
  const [shipmentSnap,disputeSnap]=await Promise.all([
    needsShipment?getDoc(doc(db,"shipments",orderId)):Promise.resolve(null),
    needsDispute?getDoc(doc(db,"disputes",orderId)):Promise.resolve(null)
  ]);
  const related={
    shipment:shipmentSnap&&shipmentSnap.exists()?shipmentSnap.data():null,
    dispute:disputeSnap&&disputeSnap.exists()?disputeSnap.data():null
  };
  state.relatedByOrder[orderId]=related;
  state.relatedLoaded.add(orderId);
  const order=state.orders.find(o=>o.id===orderId);
  if(order){
    const refreshed=mapOrder(orderId,order,related);
    Object.assign(order,refreshed);
  }
  return related;
}

async function prefetchRelatedForRole(current,baseOrders){
  if(current.role==="client") return;
  const ids=baseOrders.filter(o=>{
    if(current.role==="admin") return o.status==="disputed";
    return ["shipped","in_transit","completed","disputed","refunded"].includes(o.status);
  }).map(o=>o.id);
  await Promise.all(ids.map(id=>{const order=baseOrders.find(o=>o.id===id);return loadOrderRelated(id,order?order.status:"")}));
}

async function loadDataForUser(user){
  const current=await getOwnProfile(user.uid);
  const [profiles,baseOrders]=await Promise.all([
    getProfilesForRole(current),
    getOrdersForRole(current)
  ]);
  state.currentUser=current;
  state.sessionUser=user;
  state.users=profiles;
  await prefetchRelatedForRole(current,baseOrders);
  state.orders=baseOrders.map(o=>mapOrder(o.id,o,state.relatedByOrder[o.id]||null));
  reconcileUiState();
}

async function loadData(){
  const user=auth.currentUser;
  if(!user) return;
  await loadDataForUser(user);
}

const IDLE_TIMEOUT_MS = 15 * 60 * 1000;
let idleTimer = null;
let lastActivityAt = Date.now();
let actionLock = false;
let authGeneration = 0;
let pendingAuthError = "";
let pendingProfileBootstrap = null;

function clearSensitiveAuthFields(skipFocused=false){
  ["li-password","su-password"].forEach(id=>{
    const el=document.getElementById(id);
    if(el&&(!skipFocused||document.activeElement!==el)) el.value="";
  });
}

function scheduleSensitiveFieldClear(){
  clearSensitiveAuthFields();
  setTimeout(()=>clearSensitiveAuthFields(true),80);
  setTimeout(()=>clearSensitiveAuthFields(true),250);
}

async function autoLogoutForInactivity(){
  if(!auth.currentUser) return;
  try{await signOut(auth)}catch(e){console.warn(e)}
  clearTimeout(idleTimer);
  resetRelatedCache();
  state.settingsOpen=false;state.settingsError="";state.profileImageDraft="";
  state.users=[];state.orders=[];state.currentUser=null;state.sessionUser=null;
  state.view="auth";state.authMode="login";state.error="";
  state.notice="You were signed out after 15 minutes of inactivity.";
  render();
}

function armIdleTimer(){
  clearTimeout(idleTimer);
  if(!auth.currentUser) return;
  const remaining=Math.max(0,IDLE_TIMEOUT_MS-(Date.now()-lastActivityAt));
  idleTimer=setTimeout(autoLogoutForInactivity,remaining);
}

function noteUserActivity(){
  if(!auth.currentUser) return;
  lastActivityAt=Date.now();
  armIdleTimer();
}

["mousedown","keydown","touchstart","scroll"].forEach(evt=>{
  window.addEventListener(evt,noteUserActivity,{passive:true});
});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&auth.currentUser){
    if(Date.now()-lastActivityAt>=IDLE_TIMEOUT_MS) autoLogoutForInactivity();
    else armIdleTimer();
  }
});

window.addEventListener("pageshow",()=>{
  if(!auth.currentUser) scheduleSensitiveFieldClear();
});

function newProfileBootstrap(){
  let resolve;
  const promise=new Promise(r=>{resolve=r});
  const bootstrap={uid:null,promise,resolve};
  pendingProfileBootstrap=bootstrap;
  return bootstrap;
}

async function init(){
  try{
    await setPersistence(auth,browserSessionPersistence);
    onAuthStateChanged(auth,async user=>{
      const generation=++authGeneration;
      if(!user){
        const wasAlreadyOnAuth=state.view==="auth";
        const authError=pendingAuthError;
        pendingAuthError="";
        clearTimeout(idleTimer);
        resetRelatedCache();
        state.settingsOpen=false;state.settingsError="";state.profileImageDraft="";
        state.users=[];state.orders=[];state.currentUser=null;state.sessionUser=null;
        state.view="auth";
        state.loadingAction=false;
        if(authError) state.error=authError;
        else if(!wasAlreadyOnAuth) state.error="";
        render();
        return;
      }
      try{
        const bootstrap=pendingProfileBootstrap;
        if(bootstrap&&(!bootstrap.uid||bootstrap.uid===user.uid)){
          const result=await bootstrap.promise;
          if(!result.ok) throw result.error;
        }
        if(generation!==authGeneration||!auth.currentUser||auth.currentUser.uid!==user.uid) return;
        resetRelatedCache();
        await loadDataForUser(user);
        if(generation!==authGeneration||!auth.currentUser||auth.currentUser.uid!==user.uid) return;
        state.view="dashboard";
        state.error="";
        state.loadingAction=false;
        lastActivityAt=Date.now();
        armIdleTimer();
        render();
      }catch(e){
        if(generation!==authGeneration) return;
        pendingAuthError=friendlyError(e);
        try{await signOut(auth)}catch(signOutError){
          console.warn(signOutError);
          resetRelatedCache();
          state.users=[];state.orders=[];state.currentUser=null;state.sessionUser=null;
          state.view="auth";state.loadingAction=false;state.error=pendingAuthError;pendingAuthError="";
          render();
        }
      }
    });
  }catch(e){
    state.view="auth";
    state.error=friendlyError(e);
    render();
  }
}

async function refreshData(){
  if(!auth.currentUser||actionLock)return;
  actionLock=true;state.loadingAction=true;state.error="";state.notice="";render();
  try{
    resetRelatedCache();
    await loadData();
  }catch(e){state.error=friendlyError(e)}
  actionLock=false;state.loadingAction=false;render();
}

function switchAuthMode(mode){state.authMode=mode;state.error="";state.notice="";render()}
function switchAuthRole(role){state.authRole=role;state.error="";render()}

async function handleSignup(e){
  e.preventDefault();
  if(state.loadingAction)return;
  state.error="";state.notice="";
  const name=document.getElementById("su-name").value.trim();
  const email=document.getElementById("su-email").value.trim();
  const phone=document.getElementById("su-phone").value.trim();
  const password=document.getElementById("su-password").value;
  const business=document.getElementById("su-business")?document.getElementById("su-business").value.trim():"";
  const market=document.getElementById("su-market")?document.getElementById("su-market").value:"";
  const categories=document.getElementById("su-categories")?document.getElementById("su-categories").value.trim():"";
  if(!name||!email||!password){state.error="Enter your name, email and password.";render();return}
  if(password.length<8){state.error="Use a password with at least 8 characters.";render();return}
  state.loadingAction=true;render();
  const bootstrap=newProfileBootstrap();
  let cred=null;
  try{
    cred=await createUserWithEmailAndPassword(auth,email,password);
    bootstrap.uid=cred.user.uid;
    const profile={
      fullName:name,
      role:state.authRole,
      verified:false,
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    };
    if(phone) profile.phone=phone;
    if(state.authRole==="vendor"){
      profile.businessName=business||name;
      profile.market=market||"Computer Village (Ikeja)";
      profile.categories=categories;
    }
    await setDoc(doc(db,"users",cred.user.uid),profile);
    state.notice=state.authRole==="vendor"?"Account created. An admin must verify your vendor profile before clients can see it.":"Account created successfully.";
    bootstrap.resolve({ok:true});
    if(pendingProfileBootstrap===bootstrap) pendingProfileBootstrap=null;
  }catch(e){
    const originalError=e;
    const baseMessage=friendlyError(originalError);
    let rollbackState="none";
    if(cred&&cred.user){
      try{
        await deleteUser(cred.user);
        rollbackState="removed";
      }catch(deleteError){
        rollbackState="failed";
        console.warn("Could not roll back incomplete signup",deleteError);
        try{await signOut(auth)}catch(signOutError){console.warn(signOutError)}
      }
    }
    const finalMessage=rollbackState==="removed"
      ? baseMessage+" The incomplete account was removed; please try again."
      : rollbackState==="failed"
        ? baseMessage+" Account setup did not finish and the temporary Authentication account could not be removed automatically. Please contact the platform admin before retrying."
        : baseMessage;
    bootstrap.resolve({ok:false,error:originalError});
    if(pendingProfileBootstrap===bootstrap) pendingProfileBootstrap=null;
    state.loadingAction=false;
    state.view="auth";
    state.error=finalMessage;
    render();
    scheduleSensitiveFieldClear();
    return;
  }
  state.loadingAction=false;
}

async function handleLogin(e){
  e.preventDefault();
  if(state.loadingAction)return;
  state.error="";state.notice="";
  const email=document.getElementById("li-email").value.trim();
  const password=document.getElementById("li-password").value;
  if(!email||!password){state.error="Enter your email and password.";render();return}
  state.loadingAction=true;render();
  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    state.loadingAction=false;
    state.error=friendlyError(e);
    render();
    scheduleSensitiveFieldClear();
  }
}

async function handleLogout(){
  clearTimeout(idleTimer);
  try{await signOut(auth)}catch(e){console.warn(e)}
  resetRelatedCache();
  state.settingsOpen=false;state.settingsError="";state.profileImageDraft="";
  state.users=[];state.orders=[];state.currentUser=null;state.sessionUser=null;
  state.view="auth";state.authMode="login";state.error="";state.notice="";state.loadingAction=false;render();
  scheduleSensitiveFieldClear();
}

function queueHistory(batch,orderId,status){
  const historyRef=doc(collection(db,"orderHistory"));
  batch.set(historyRef,{
    orderId,
    status,
    actorId:auth.currentUser.uid,
    createdAt:serverTimestamp()
  });
}

async function runAction(work, fallbackStateKey){
  if(actionLock)return false;
  actionLock=true;
  state.error="";state.notice="";if(fallbackStateKey)state[fallbackStateKey]="";state.loadingAction=true;render();
  let writeSucceeded=false;
  try{
    await work();
    writeSucceeded=true;
    resetRelatedCache();
    try{
      await loadData();
    }catch(refreshError){
      state.notice="Your update was saved, but the dashboard could not refresh automatically. Tap the refresh button to reload the latest data.";
      state.error=friendlyError(refreshError);
    }
  }catch(e){
    if(fallbackStateKey)state[fallbackStateKey]=friendlyError(e);
    else state.error=friendlyError(e);
  }finally{
    actionLock=false;state.loadingAction=false;render();
  }
  return writeSucceeded;
}


function openAccountSettings(){

  if(!u||!["client","vendor"].includes(u.role)||state.loadingAction)return;
  state.settingsOpen=true;
  state.settingsError="";
  state.profileImageDraft=u.role==="vendor"?(u.profileImage||""):"";

}

function closeAccountSettings(){
  if(state.loadingAction)return;
  state.settingsOpen=false;
  state.settingsError="";
  state.profileImageDraft="";
  render();
}

  }
  return `<div class="vendorThumbFallback" aria-hidden="true">${escapeHtml(initials(v?(v.businessName||v.name):"Vendor"))}</div>`;
}

function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||""));
    reader.onerror=()=>reject(new Error("Could not read that image."));
    reader.readAsDataURL(file);
  });
}

function resizeVendorImage(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const maxDim=320;
        const scale=Math.min(1,maxDim/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
        const width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
        const height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
        const canvas=document.createElement("canvas");
        canvas.width=width;canvas.height=height;
        const ctx=canvas.getContext("2d");
        ctx.fillStyle="#ffffff";
        ctx.fillRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg",0.76));
      }catch(e){reject(e)}
    };
    img.onerror=()=>reject(new Error("That image could not be processed."));
    img.src=dataUrl;
  });
}

async function handleVendorImage(event){
  const u=state.currentUser;
  if(!u||u.role!=="vendor")return;
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  state.settingsError="";
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    state.settingsError="Use a JPG, PNG or WebP image.";
    render();return;
  }
  if(file.size>8*1024*1024){
    state.settingsError="Choose an image smaller than 8 MB.";
    render();return;
  }
  try{
    const source=await readFileAsDataUrl(file);
    const resized=await resizeVendorImage(source);
    if(resized.length>350000) throw new Error("The optimized image is still too large. Try a smaller image.");
    state.profileImageDraft=resized;
    render();
  }catch(e){
    state.settingsError=friendlyError(e);
    render();
  }
}

function removeVendorImage(){
  if(!state.currentUser||state.currentUser.role!=="vendor")return;
  state.profileImageDraft="";
  state.settingsError="";
  render();
}

async function saveAccountSettings(e){
  e.preventDefault();
  const u=state.currentUser;
  if(!u||!["client","vendor"].includes(u.role)||state.loadingAction)return;
  state.settingsError="";
  const name=(document.getElementById("settings-name")?.value||"").trim();
  const phone=(document.getElementById("settings-phone")?.value||"").trim();
  if(!name){state.settingsError="Enter your name.";render();return}
  if(name.length>100){state.settingsError="Keep your name under 100 characters.";render();return}
  if(phone.length>30){state.settingsError="Keep the phone number under 30 characters.";render();return}

  const updates={fullName:name,phone,updatedAt:serverTimestamp()};
  if(u.role==="vendor"){
    const business=(document.getElementById("settings-business")?.value||"").trim();
    const market=(document.getElementById("settings-market")?.value||"").trim();
    const categories=(document.getElementById("settings-categories")?.value||"").trim();
    if(!business){state.settingsError="Enter your business name.";render();return}
    if(business.length>120||market.length>120){state.settingsError="Business name and market must each stay under 120 characters.";render();return}
    if(categories.length>500){state.settingsError="Keep the product categories under 500 characters.";render();return}
    if((state.profileImageDraft||"").length>350000){state.settingsError="The vendor image is too large.";render();return}
    updates.businessName=business;
    updates.market=market;
    updates.categories=categories;
    updates.profileImage=state.profileImageDraft||"";
  }

  const saved=await runAction(async()=>{
    await updateDoc(doc(db,"users",u.id),updates);
  },"settingsError");
  if(saved){
    state.settingsOpen=false;
    state.settingsError="";
    state.profileImageDraft="";
    if(!state.error) state.notice="Profile updated successfully.";
    render();
  }
}

function renderAccountSettings(){
  const u=state.currentUser;
  if(!state.settingsOpen||!u||!["client","vendor"].includes(u.role))return "";
  const email=state.sessionUser&&state.sessionUser.email?state.sessionUser.email:"";
  const vendorFields=u.role==="vendor"?`
    <div class="full">

async function resolveDispute(id,resolution){
  const el=document.getElementById("dispute-notes-"+id);
  const notes=el?el.value.trim():"";
  if(!confirm(resolution==="release"?"Release the order to the vendor?":"Resolve in the client's favour?"))return;
  await runAction(async()=>{
    const batch=writeBatch(db);
    const orderUpdate={status:resolution==="release"?"completed":"refunded",updatedAt:serverTimestamp()};
    if(resolution==="release")orderUpdate.completedAt=serverTimestamp();
    batch.update(doc(db,"orders",id),orderUpdate);
    batch.update(doc(db,"disputes",id),{
      status:"resolved",
      resolution,
      adminNotes:notes,
      resolvedAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });
    queueHistory(batch,id,orderUpdate.status);
    await batch.commit();
  });
}

function renderTracking(o){
  const role=state.currentUser?state.currentUser.role:"";
  const displayKey=displayStatusKey(o.status,role);
  const statusPillClass=displayKey==="disputed"?"disputeStatus":displayKey==="refunded"?"refundStatus":displayKey==="cancelled"?"cancelStatus":displayKey==="declined"?"declineStatus":"";
  const terminalStates=new Set(["disputed","refunded","cancelled","declined"]);
  const terminalKey=terminalStates.has(displayKey)?displayKey:"completed";
  const terminalLabel=ORDER_STATUS_META[terminalKey]?ORDER_STATUS_META[terminalKey].flowLabel:terminalKey;
  const stages=[["requested","Request"],["invoiced","Quote"],["escrow_funded","Escrow"],["sourcing","Sourcing"],["shipped","Shipped"],["in_transit","In transit"],[terminalKey,terminalLabel]];
  const rank={requested:0,invoiced:1,escrow_funded:3,shipped:4,in_transit:5,completed:6,disputed:6,refunded:6};
  const normalCurrent=rank[o.status]??0;
  let completedThrough=normalCurrent-1;
  if(o.status==="escrow_funded") completedThrough=2;
  if(o.status==="declined") completedThrough=0;
  if(o.status==="cancelled") completedThrough=(o.invoiceNumber||o.itemCost!=null)?1:0;

  const nodes=stages.map(([k,label],i)=>{
    const isTerminal=i===stages.length-1;
    let active=false;
    if(isTerminal&&terminalStates.has(displayKey)) active=true;
    else if(!terminalStates.has(displayKey)) active=(o.status==="escrow_funded"&&k==="sourcing")||o.status===k;
    const done=!active&&i<=completedThrough;
    const stateClass=k==="disputed"?"disputeState":k==="refunded"?"refundState":k==="cancelled"?"cancelState":k==="declined"?"declineState":"";
    return `<div class="flowNode ${active?"active":done?"done":""} ${stateClass}"><div class="flowCircle">${flowIcon(k)}</div><div>${escapeHtml(label)}</div></div>`;
  }).join("");
  const carrier=o.shipment&&o.shipment.carrier?o.shipment.carrier:"—";
  const tracking=o.shipment&&o.shipment.tracking_number?o.shipment.tracking_number:"—";
  const loading=state.relatedLoading.has(o.id);
  const flowBody=`<div class="flowHead"><div class="flowHeadTitle">Track your order</div><button class="action receiptBtn" onclick="printOrderReceipt('${o.id}')">▣ &nbsp; Print receipt</button></div>
    <div class="flowTimelineWrap"><div class="flowTimeline">${nodes}</div></div>
    ${loading?`<div class="shipmentNote"><b>Loading shipment details…</b></div>`:""}
    ${o.shipmentProof?`<div class="shipmentNote"><b>Shipment details:</b> ${escapeHtml(o.shipmentProof)}</div>`:""}
    <div class="flowMeta">
      <div class="flowMetaItem"><div class="metaIcon">◉</div><div><div class="metaLabel">Carrier</div><div class="metaValue">${escapeHtml(carrier)}</div></div></div>
      <div class="flowMetaItem"><div class="metaIcon">◇</div><div><div class="metaLabel">Tracking</div><div class="metaValue">${escapeHtml(tracking)}</div></div></div>
      <div class="flowMetaItem"><div class="metaIcon">□</div><div><div class="metaLabel">Item</div><div class="metaValue">${escapeHtml(o.itemDesc||"—")}</div></div></div>
    </div>`;

  if(state.currentUser&&state.currentUser.role==="client"){
    const isOpen=state.openFlowIds.has(o.id);
    return `<details class="flowDetails" ${isOpen?"open":""} ontoggle="handleFlowToggle(event,'${o.id}')"><summary class="flowSummary"><div class="flowTitle"><b>Goods Flow</b><span class="flowStatus ${statusPillClass}">${escapeHtml(displayStatusLabel(o.status,role,true))}</span></div><div class="flowSummaryRight"><span>View details</span><span class="flowChevron">⌄</span></div></summary><div class="flowBody">${flowBody}</div></details>`;
  }
  return `<div class="flowCard mt16"><div class="flowBody" style="border-top:0">${flowBody}</div></div>`;
}

async function handleFlowToggle(event,id){
  if(!state.currentUser||state.currentUser.role!=="client")return;
  if(!event.currentTarget.open){state.openFlowIds.delete(id);return}
  state.openFlowIds.add(id);
  if(state.relatedLoaded.has(id)||state.relatedLoading.has(id))return;
  state.relatedLoading.add(id);
  try{
    const order=state.orders.find(o=>o.id===id);
    await loadOrderRelated(id,order?order.status:"");
  }catch(e){
    state.error=friendlyError(e);
  }
  state.relatedLoading.delete(id);
  render();
}

  const o=state.orders.find(x=>x.id===id);if(!o)return;const c=userById(o.clientId),v=userById(o.vendorId);

  const body=`<!doctype html><html><head><meta charset="utf-8"><title>Receipt ${escapeHtml(o.id)}</title><style>body{font-family:Arial;padding:32px;color:#222}table{width:100%;border-collapse:collapse}td{padding:9px;border-bottom:1px solid #ddd}.total{font-size:18px;font-weight:bold}</style></head><body><h1>Lagos Sourcing — Order Receipt</h1><p><b>Order:</b> ${escapeHtml(o.id)}</p><p><b>Date:</b> ${displayDateTime(o.createdAt)}</p><table><tr><td>Client</td><td>${escapeHtml(clientLabel)}</td></tr><tr><td>Vendor</td><td>${escapeHtml(vendorLabel)}</td></tr><tr><td>Item</td><td>${escapeHtml(o.itemDesc)}</td></tr><tr><td>Status</td><td>${escapeHtml(receiptStatus)}</td></tr>${o.itemCost!=null?`<tr><td>Item cost</td><td>${formatNaira(o.itemCost)}</td></tr><tr><td>Delivery</td><td>${formatNaira(o.deliveryCost)}</td></tr><tr class="total"><td>Total</td><td>${formatNaira(o.totalCost)}</td></tr>`:""}${o.shipmentProof?`<tr><td>Shipment</td><td>${escapeHtml(o.shipmentProof)}</td></tr>`:""}</table><p style="margin-top:24px;font-size:12px;color:#666">Payment/escrow is still simulated in this development version.</p><script>window.onload=()=>window.print();<\/script></body></html>`;
  const w=window.open("","_blank","width=800,height=900");if(!w){alert("Allow pop-ups to print.");return}w.document.write(body);w.document.close();
}

        ${vendorFields}
        <button class="btn-primary" style="padding:11px;border-radius:8px" ${state.loadingAction?"disabled":""}>${state.loadingAction?"Creating account…":"Create account"}</button>
      </form><p class="centerText text14 muted mt16">Already registered? <button class="action" onclick="switchAuthMode('login')">Log in</button></p>`:
      `<form onsubmit="handleLogin(event)" class="grid" autocomplete="off">
        <div><label class="text14 semibold">Email</label><input id="li-email" name="login-email" type="email" autocomplete="off" required></div>
        <div><label class="text14 semibold">Password</label><input id="li-password" name="login-password" type="password" autocomplete="off" value="" required></div>
        <button class="btn-primary" style="padding:11px;border-radius:8px" ${state.loadingAction?"disabled":""}>${state.loadingAction?"Logging in…":"Log in"}</button>
      </form><p class="centerText text14 muted mt16">New here? <button class="action" onclick="switchAuthMode('signup')">Create an account</button></p>`}
    </div></div>`;
}

function renderClientPanels(u){
  const vendors=state.users.filter(x=>x.role==="vendor"&&x.verified);
  const shown=state.searchResults===null?vendors:state.searchResults;
  const my=state.orders.filter(o=>o.clientId===u.id);
  const requestBox=state.requestingVendorId?(()=>{const v=userById(state.requestingVendorId);return `<div class="card p20 mb16 requestBox"><b>Request an item from ${escapeHtml(v?(v.businessName||v.name):"vendor")}</b><form onsubmit="submitRequest(event)" class="grid mt12"><textarea id="req-item" rows="3" maxlength="1000" placeholder="Describe the exact item you want"></textarea>${state.requestError?`<div class="error">${escapeHtml(state.requestError)}</div>`:""}<div class="flex gap8"><button class="btn-primary action">Send request</button><button type="button" class="action" onclick="closeRequestForm()">Close</button></div></form></div>`})():"";
  const vendorCards=shown.length?shown.map(v=>`<div class="vendorCard"><div class="flex between center gap12"><div class="vendorIdentity">${renderVendorThumb(v)}<div style="min-width:0"><div class="vendorName">${escapeHtml(v.businessName||v.name)}</div><div class="vendorMeta">${escapeHtml(v.market||"")}</div><div class="vendorCats">${escapeHtml(v.categories.join(", "))}</div></div></div><button class="btn-primary action" onclick="openRequestForm('${v.id}')">Request item</button></div></div>`).join(""):`<div class="surfaceCard muted text14">No matching verified vendors.</div>`;
  const orders=my.length?my.map(o=>{
    const v=userById(o.vendorId),disputing=state.disputingOrderId===o.id;
    const deliveryActions=["shipped","in_transit"].includes(o.status)?`<div class="borderTop pt12 mt12">${disputing?`<form onsubmit="submitDispute(event)" class="grid"><textarea id="dispute-reason" rows="2" maxlength="1500" placeholder="Explain the problem"></textarea>${state.disputeError?`<div class="error">${escapeHtml(state.disputeError)}</div>`:""}<div class="flex gap8"><button class="redbtn action">Submit dispute</button><button type="button" class="action" onclick="closeDisputeForm()">Close</button></div></form>`:`<div class="flex gap8 wrap"><button class="btn-primary action" onclick="confirmReceipt('${o.id}')">Confirm received</button><button class="action danger" onclick="openDisputeForm('${o.id}')">Raise dispute</button></div>`}</div>`:"";
    return `<div class="orderCard"><div class="orderTop"><div><div class="orderTitle">${escapeHtml(o.itemDesc)}</div><div class="orderMeta">${escapeHtml(v?(v.businessName||v.name):(o.vendorName||"Vendor"))} · ${displayDate(o.createdAt)}</div></div>${statusBadge(o.status)}</div>
      ${renderInvoice(o,v,u)}
      ${["requested","invoiced"].includes(o.status)?`<button class="action danger mt12" onclick="cancelOrder('${o.id}')">Cancel order</button>`:""}
      ${o.status==="invoiced"?`<div class="warn mt12">Payment is simulated in this build.</div><button class="btn-primary action mt8" onclick="fundEscrow('${o.id}')">Simulate escrow funding</button>`:""}
      ${o.status==="escrow_funded"?`<div class="notice mt12">Escrow state recorded. Vendor can now source and ship.</div>`:""}
      ${deliveryActions}
      ${o.status==="disputed"?`<div class="error mt12">Dispute is open and awaiting admin review.</div>`:""}
      ${o.status==="refunded"?`<div class="notice mt12">Dispute resolved in the client's favour.</div>`:""}
      ${o.status==="cancelled"?`<div class="muted text14 mt12">Cancelled before escrow funding.</div>`:""}
      ${renderTracking(o)}</div>`;
  }).join(""):`<div class="surfaceCard muted text14">No orders yet.</div>`;
  return `${requestBox}<div class="clientLayout"><div><div class="surfaceCard"><div class="panelHeading" style="font-size:17px;margin-bottom:0">Find a verified vendor</div><form onsubmit="runVendorSearch(event)" class="searchRow"><input id="vendor-search" value="${escapeHtml(state.searchQuery)}" placeholder="e.g. MacBook, phone, electronics"><button class="btn-primary action">Search</button></form>${state.searchResults!==null?`<button type="button" class="action small mt12" onclick="clearVendorSearch()">Clear search</button>`:""}</div><div class="vendorList">${vendorCards}</div></div><div class="ordersColumn"><h3 class="panelHeading">My orders</h3><div class="ordersList">${orders}</div></div></div>`;
}

function renderVendorPanels(u){
  if(!u.verified)return `<div class="card p24 centerText"><h3>Awaiting admin verification</h3><p class="muted">Your account works, but clients will only see your vendor profile after an admin verifies it.</p></div>`;
  const my=state.orders.filter(o=>o.vendorId===u.id),requested=my.filter(o=>o.status==="requested"),others=my.filter(o=>o.status!=="requested");
  const newRows=requested.length?requested.map(o=>{const c=userById(o.clientId),open=state.invoicingOrderId===o.id;return `<div class="card p16"><div class="flex between start"><div><b>${escapeHtml(o.itemDesc)}</b><div class="small muted">From ${escapeHtml(c?c.name:(o.clientName||"Client"))}</div></div>${statusBadge(o.status)}</div>${open?`<form onsubmit="submitInvoice(event)" class="grid g2 mt12"><div><label class="small">Item cost (₦)</label><input id="inv-item-cost" type="number" min="0" step="0.01"></div><div><label class="small">Delivery (₦)</label><input id="inv-delivery-cost" type="number" min="0" step="0.01"></div>${state.invoiceError?`<div class="error" style="grid-column:1/-1">${escapeHtml(state.invoiceError)}</div>`:""}<div class="flex gap8" style="grid-column:1/-1"><button class="btn-primary action">Generate invoice</button><button type="button" class="action" onclick="closeInvoiceForm()">Close</button></div></form>`:`<div class="flex gap8 mt12"><button class="btn-primary action" onclick="openInvoiceForm('${o.id}')">Quote & invoice</button><button class="action" onclick="declineRequest('${o.id}')">Decline</button></div>`}</div>`}).join(""):`<div class="muted text14">No new requests.</div>`;
  const rows=others.length?others.map(o=>{const c=userById(o.clientId),ship=state.shippingOrderId===o.id;return `<div class="card p16"><div class="flex between start"><div><b>${escapeHtml(o.itemDesc)}</b><div class="small muted">${escapeHtml(c?c.name:(o.clientName||"Client"))}</div></div>${statusBadge(o.status)}</div>${renderInvoice(o,u,c)}
    ${o.status==="invoiced"?`<div class="muted text14 mt12">Waiting for the client to fund escrow.</div>`:""}
    ${o.status==="escrow_funded"?(ship?`<form onsubmit="submitShipment(event)" class="grid mt12"><div><label class="small">Carrier</label><input id="ship-carrier" placeholder="Courier/company"></div><div><label class="small">Tracking number</label><input id="ship-tracking" placeholder="Tracking number"></div><div><label class="small">Shipment notes</label><textarea id="ship-notes" rows="2"></textarea></div>${state.shipError?`<div class="error">${escapeHtml(state.shipError)}</div>`:""}<div class="flex gap8"><button class="btn-primary action">Mark shipped</button><button type="button" class="action" onclick="closeShipForm()">Close</button></div></form>`:`<button class="btn-primary action mt12" onclick="openShipForm('${o.id}')">Log shipment</button>`):""}
    ${o.status==="shipped"?`<button class="action mt12" onclick="markInTransit('${o.id}')">Mark in transit</button>`:""}
    ${o.status==="disputed"?`<div class="error mt12">Client dispute: ${escapeHtml(o.dispute?o.dispute.reason:"")}</div>`:""}
    ${renderTracking(o)}</div>`}).join(""):`<div class="muted text14">No quoted/active orders.</div>`;
  return `<div class="grid g2"><div><h3>New requests</h3><div class="grid">${newRows}</div></div><div><h3>Quoted / active</h3><div class="grid">${rows}</div></div></div>`;
}

function renderAdminProgress(){
  const total=state.orders.length,completed=state.orders.filter(o=>o.status==="completed").length,active=state.orders.filter(o=>!["completed","cancelled","declined","refunded"].includes(o.status)).length;
  const percent=total?Math.round(completed/total*100):0;
  const stages=[["requested","Requested"],["invoiced","Invoiced"],["escrow_funded","Escrow funded"],["shipped","Shipped"],["in_transit","In transit"],["completed","Completed"]];
  return `<div class="card p20 mb24"><div class="flex between start"><div><div class="small faint">BACKEND OPERATIONS</div><h3 style="margin:4px 0">Platform progress</h3><div class="small muted">These counts are now loaded from the shared database.</div></div><b style="color:#047857">${percent}% completed</b></div><div class="grid g3 mt16"><div class="card p12"><b>${total}</b><div class="small muted">Total orders</div></div><div class="card p12"><b>${active}</b><div class="small muted">Active</div></div><div class="card p12"><b>${completed}</b><div class="small muted">Completed</div></div></div><div class="mt16">${stages.map(([s,l])=>{const c=state.orders.filter(o=>o.status===s).length,w=total?Math.round(c/total*100):0;return `<div class="mb12"><div class="flex between small"><span>${l}</span><b>${c}</b></div><div class="progressTrack mt4"><div class="progressFill" style="width:${w}%"></div></div></div>`}).join("")}</div></div>`;
}
function renderAdminPanels(){
  const vendors=state.users.filter(u=>u.role==="vendor"),clients=state.users.filter(u=>u.role==="client"),disputes=state.orders.filter(o=>o.status==="disputed");
  const disputeRows=disputes.length?disputes.map(o=>{const c=userById(o.clientId),v=userById(o.vendorId);return `<div class="card p16"><b>${escapeHtml(o.itemDesc)}</b><div class="small muted mt4">Client: ${escapeHtml(c?c.name:(o.clientName||"Unknown"))} · Vendor: ${escapeHtml(v?(v.businessName||v.name):(o.vendorName||"Unknown"))}</div><div class="error mt12">${escapeHtml(o.dispute?o.dispute.reason:"No reason")}</div><textarea id="dispute-notes-${o.id}" class="mt12" rows="2" placeholder="Admin notes"></textarea><div class="flex gap8 mt8"><button class="btn-primary action" onclick="resolveDispute('${o.id}','release')">Release to vendor</button><button class="redbtn action" onclick="resolveDispute('${o.id}','refund')">Refund client</button></div></div>`}).join(""):`<div class="muted text14">No open disputes.</div>`;
  const rows=state.users.map(u=>`<tr><td class="mono small">${escapeHtml(u.id)}</td><td>${escapeHtml(u.name)}</td><td>${roleBadge(u.role)}</td><td>${escapeHtml(u.businessName||"—")}</td><td>${u.role==="vendor"?`<button class="action small ${u.verified?"verifyDone":"verifyPending"}" onclick="toggleVendorVerified('${u.id}')">${u.verified?"Verified ✓":"Verify now"}</button>`:"—"}</td></tr>`).join("");
  return `${renderAdminProgress()}<div class="grid g3 mb24"><div class="card p16"><b>${clients.length}</b><div class="small muted">Clients</div></div><div class="card p16"><b>${vendors.filter(v=>v.verified).length}/${vendors.length}</b><div class="small muted">Verified vendors</div></div><div class="card p16"><b>${disputes.length}</b><div class="small muted">Open disputes</div></div></div><h3>Dispute queue</h3><div class="grid mb24">${disputeRows}</div><div class="card p16"><h3>Registered profiles</h3><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Business</th><th>Verification</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function renderDashboard(){
  const u=state.currentUser;if(!u)return renderAuth();
  return `<div>
    <div class="appTopbar"><div class="brand"><span class="brandText">LAGOS SOURCING</span></div><div class="userTools"><button class="action iconbtn" onclick="refreshData()" ${state.loadingAction?"disabled":""} title="Refresh" aria-label="Refresh"><span class="${state.loadingAction?"spin":""}">↻</span></button>${renderUserAvatar(u)}<button class="action logoutBtn" onclick="handleLogout()" aria-label="Log out">Log out</button></div></div>
    <div class="dashboardHero"><div><h1>Welcome, ${escapeHtml(u.name)} <span aria-hidden="true">👋</span></h1><div class="heroSub">${escapeHtml(u.role.charAt(0).toUpperCase()+u.role.slice(1))} dashboard</div></div>${roleBadge(u.role)}</div>
    ${state.notice?`<div class="notice mb16">${escapeHtml(state.notice)}</div>`:""}
    ${state.error?`<div class="error mb16">${escapeHtml(state.error)}</div>`:""}
    ${u.role==="client"?renderClientPanels(u):u.role==="vendor"?renderVendorPanels(u):renderAdminPanels(u)}
    ${renderAccountSettings()}
  </div>`;
}
function render(){
  const root=document.getElementById("root");
  if(state.view==="loading")root.innerHTML=`<div class="card p24">Connecting to the backend…</div>`;
  else if(state.view==="auth"){root.innerHTML=renderAuth();scheduleSensitiveFieldClear();}
  else root.innerHTML=renderDashboard();
}


Object.assign(window,{
  switchAuthMode,switchAuthRole,handleSignup,handleLogin,handleLogout,refreshData,
  toggleVendorVerified,runVendorSearch,clearVendorSearch,openRequestForm,closeRequestForm,
  submitRequest,openInvoiceForm,closeInvoiceForm,submitInvoice,declineRequest,cancelOrder,
  fundEscrow,openShipForm,closeShipForm,submitShipment,markInTransit,confirmReceipt,
  openDisputeForm,closeDisputeForm,submitDispute,resolveDispute,printOrderReceipt,handleFlowToggle,
  openAccountSettings,closeAccountSettings,saveAccountSettings,handleVendorImage,removeVendorImage
});

console.info(`Lagos Sourcing ${APP_VERSION}`);
init();
</script>

</body>
</html>
