name: UI and syntax checks

on:
  push:
    branches:
      - main
      - uiux-beta-polish-2026-11-25
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-and-syntax:
    name: UI and JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate UI structure, accessibility hooks and JavaScript syntax
        run: node .github/scripts/validate.mjs
